<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java OOP Exam Kit — كويز</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--good:#4ade80;--bad:#f87171;--border:#334155;--code:#0b1220}
@media (prefers-color-scheme:light){:root{--bg:#f8fafc;--panel:#ffffff;--text:#0f172a;--muted:#475569;--accent:#0284c7;--good:#16a34a;--bad:#dc2626;--border:#cbd5e1;--code:#f1f5f9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.4em 0}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:10px 0}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
button,.btn{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:1rem}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#082f49;border:none;font-weight:700}
button:disabled{opacity:.4;cursor:default}
select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin:14px 0}
pre.code{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto;direction:ltr;text-align:left;font-family:Consolas,Menlo,monospace;font-size:.9rem;line-height:1.5}
pre.code code{font-family:inherit}
.kw{color:#c084fc}.str{color:#86efac}.num{color:#fbbf24}.com{color:#64748b;font-style:italic}.typ{color:#7dd3fc}.ann{color:#f472b6}
.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.opt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:right;cursor:pointer;font-size:1rem}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:rgba(56,189,248,.12)}
textarea{width:100%;background:var(--code);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:Consolas,monospace;direction:ltr;text-align:left;min-height:90px;font-size:.95rem}
.feedback{border-radius:8px;padding:12px;margin:12px 0;display:none}
.feedback.ok{display:block;background:rgba(74,222,128,.12);border:1px solid var(--good)}
.feedback.no{display:block;background:rgba(248,113,113,.12);border:1px solid var(--bad)}
.expl{background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:12px;margin-top:10px;display:none}
.expl.show{display:block}
.score{font-weight:700;color:var(--accent)}
.muted{color:var(--muted);font-size:.9rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:2px 10px;font-size:.8rem;color:var(--muted)}
</style>
</head>

<script>
const DATA = {"topics": {"inheritance": "وراثة و Constructor Chaining", "polymorphism": "Polymorphism", "static-final-this-super": "static و final و this و super", "abstract-interface": "Abstract Classes و Interfaces", "access-modifiers": "Access Modifiers و Packages", "exceptions": "Exceptions", "strings-equals": "String و equals و hashCode", "casting": "Casting و instanceof", "inner-classes": "Inner Classes و Enums", "collections": "Collections"}, "questions": [{"id": "abstract-interface/q01", "topic": "abstract-interface", "topicLabel": "Abstract Classes و Interfaces", "q": "q01", "title": "الـ Abstract Class ليها Constructor", "code": "abstract class A {\n    A() {\n        System.out.println(\"A-ctor\");\n    }\n\n    abstract void m();\n}\n\nclass B extends A {\n    B() {\n        System.out.println(\"B-ctor\");\n    }\n\n    void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B().m();\n    }\n}\n", "expected": "A-ctor\nB-ctor\nB.m", "exception": null, "compileError": false, "explanation": "رغم إن A abstract ومينفعش تعملها instantiate، الـ constructor بتاعها بينادى عادي لما تعمل `new B()` عن طريق `super()`. بعدين `m()` بتتنفذ على النسخة بتاعة B."}, {"id": "abstract-interface/q02", "topic": "abstract-interface", "topicLabel": "Abstract Classes و Interfaces", "q": "q02", "title": "Interface Fields بتكون final تلقائيًا", "code": "interface I {\n    int X = 5;\n}\n\nclass T implements I {\n    void change() {\n        X = 10;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new T().change();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "أي field جوه interface هو `public static final` ضمنيًا. `X = 10` محاولة تغيير final variable فـ javac بيفشل — ومينفعش تعمل implements من غير ما تتعامل معاها كـ constant."}, {"id": "abstract-interface/q03", "topic": "abstract-interface", "topicLabel": "Abstract Classes و Interfaces", "q": "q03", "title": "حل الـ Diamond Problem يدويًا", "code": "interface A {\n    default void m() {\n        System.out.println(\"A.m\");\n    }\n}\n\ninterface B {\n    default void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\nclass C implements A, B {\n    public void m() {\n        System.out.println(\"C.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new C().m();\n    }\n}\n", "expected": "C.m", "exception": null, "compileError": false, "explanation": "لما class بيعمل implements لـ interface اتنين فيهم `default m()` نفس الاسم، لازم يعمل override بنفسه عشان يحل التضارب. `C.m` هنا هي اللي بتتنفذ — ولو شالها كان هيبقى compile error."}, {"id": "abstract-interface/q04", "topic": "abstract-interface", "topicLabel": "Abstract Classes و Interfaces", "q": "q04", "title": "Diamond Problem من غير حل", "code": "interface A {\n    default void m() {\n        System.out.println(\"A.m\");\n    }\n}\n\ninterface B {\n    default void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\nclass C implements A, B {\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new C().m();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`A` و`B` فيهم default methods بنفس الاسم و`C` مش حاسمة بينهم — الـ compiler مش بيعرف أنهي `m()` تنفذ، فبيرمي compile error لازم `C` تعمل override."}, {"id": "abstract-interface/q05", "topic": "abstract-interface", "topicLabel": "Abstract Classes و Interfaces", "q": "q05", "title": "Static و Default Methods في Interface", "code": "interface I {\n    static void m() {\n        System.out.println(\"I.m\");\n    }\n\n    default void d() {\n        System.out.println(\"I.d\");\n    }\n}\n\nclass T implements I {\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        I.m();\n        T t = new T();\n        t.d();\n    }\n}\n", "expected": "I.m\nI.d", "exception": null, "compileError": false, "explanation": "`static` methods في interface بتنادى باسم الـ interface بس ومبتتورثش للـ classes اللي بتعمل implements — عشان كده `I.m()` شغالة و`t.m()` كانت هتفشل. الـ `default` methods بتتورث عادي وبتتنفذ على أي instance."}, {"id": "abstract-interface/q06", "topic": "abstract-interface", "topicLabel": "Abstract Classes و Interfaces", "q": "q06", "title": "Interface Methods public ضمنيًا", "code": "interface I {\n    void m();\n}\n\nclass T implements I {\n    void m() {\n        System.out.println(\"T.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new T().m();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "أي method في interface هو `public` تلقائيًا، فالـ implementation لازم يكون `public` برضه. `void m()` من غير modifier صلاحيتها أضعف (package-private) فـ javac بيرفض."}, {"id": "abstract-interface/q07", "topic": "abstract-interface", "topicLabel": "Abstract Classes و Interfaces", "q": "q07", "title": "Interface Extends Interface", "code": "interface A {\n    default void m() {\n        System.out.println(\"A.m\");\n    }\n}\n\ninterface B extends A {\n}\n\nclass C implements B {\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new C().m();\n    }\n}\n", "expected": "A.m", "exception": null, "compileError": false, "explanation": "`B extends A` بيرث الـ default method `m()`، و`C implements B` بياخدها هي كمان بالتوريث غير المباشر. `new C().m()` بتلاقي `A.m` فبتتنفذ عادي."}, {"id": "access-modifiers/q01", "topic": "access-modifiers", "topicLabel": "Access Modifiers و Packages", "q": "q01", "title": "Private يعني نفس الـ Class بس", "code": "class A {\n    private int x = 5;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(new A().x);\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`x` private في A، فمحدش بره A يقدر يوصلها — حتى مش.Main` اللي في نفس الملف. javac بيفشل بـ \"x has private access\"."}, {"id": "access-modifiers/q02", "topic": "access-modifiers", "topicLabel": "Access Modifiers و Packages", "q": "q02", "title": "Protected يعني Package + Subclasses", "code": "class A {\n    protected int x = 5;\n\n    protected void m() {\n        System.out.println(\"A.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new A();\n        System.out.println(a.x);\n        a.m();\n    }\n}\n", "expected": "5\nA.m", "exception": null, "compileError": false, "explanation": "`protected` بيسمح بالوصول من نفس الـ package (وده حالنا هنا لأن كل الكلاسات في نفس الملف)، وكمان من الـ subclasses حتى لو في package تانية. هنا الوصول شغال عادي."}, {"id": "access-modifiers/q03", "topic": "access-modifiers", "topicLabel": "Access Modifiers و Packages", "q": "q03", "title": "Private Constructor مع Static Factory", "code": "class A {\n    private A() {\n    }\n\n    static A create() {\n        return new A();\n    }\n\n    int v = 7;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = A.create();\n        System.out.println(a.v);\n    }\n}\n", "expected": "7", "exception": null, "compileError": false, "explanation": "الـ private constructor بيمنع `new A()` من بره A، بس `create()` static method جوه A نفسها تقدر تناديه. النمط ده بيستخدم للتحكم في إنشاء الـ objects."}, {"id": "access-modifiers/q04", "topic": "access-modifiers", "topicLabel": "Access Modifiers و Packages", "q": "q04", "title": "الـ Inner Class تقدر توصل private members بتاعة Outer", "code": "class Outer {\n    private int x = 5;\n\n    class Inner {\n        int get() {\n            return x;\n        }\n    }\n\n    int run() {\n        return new Inner().get();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(new Outer().run());\n    }\n}\n", "expected": "5", "exception": null, "compileError": false, "explanation": "في Java 11+ الـ nested classes والـ outer class بيكونوا \"nestmates\" — الـ Inner class تقدر تقرأ `x` حتى لو private لأنها منطقياً جزء من نفس الـ top-level class."}, {"id": "access-modifiers/q05", "topic": "access-modifiers", "topicLabel": "Access Modifiers و Packages", "q": "q05", "title": "الوصول للـ static عن طريق instance", "code": "class A {\n    static int s = 3;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new A();\n        a.s = 10;\n        System.out.println(A.s + \" \" + a.s);\n    }\n}\n", "expected": "10 10", "exception": null, "compileError": false, "explanation": "`s` static بس الكود `a.s = 10` بيترجم عادي — الـ compiler بيحولها لـ `A.s`. تحذير بس مش error، والاتنين `A.s` و`a.s` نفس المتغير فبيطبعوا نفس القيمة."}, {"id": "access-modifiers/q06", "topic": "access-modifiers", "topicLabel": "Access Modifiers و Packages", "q": "q06", "title": "الـ Private Fields مبتتورثش", "code": "class A {\n    private int x = 5;\n}\n\nclass B extends A {\n    void show() {\n        System.out.println(x);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B().show();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`x` private في A فمش موجودة في B أصلاً — الوراثة مبتشملش الـ private members. فلما `B.show` بتحاول تقرأ `x` الـ compiler مش بيلاقيها في B ولا يقدر يوصلها في A."}, {"id": "access-modifiers/q07", "topic": "access-modifiers", "topicLabel": "Access Modifiers و Packages", "q": "q07", "title": "ممنوع تضعّف الـ Access في الـ Override", "code": "class A {\n    public void m() {\n        System.out.println(\"A.m\");\n    }\n}\n\nclass B extends A {\n    void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`A.m` public و`B.m` package-private (بدون modifier) — الـ override لازم يكون بنفس الـ access أو أوسع، مش أضيق. javac بيرفض بـ \"attempting to assign weaker access privileges\"."}, {"id": "casting/q01", "topic": "casting", "topicLabel": "Casting و instanceof", "q": "q01", "title": "Upcasting و Downcasting", "code": "class A {\n}\n\nclass B extends A {\n    void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new B();\n        B b = (B) a;\n        b.m();\n    }\n}\n", "expected": "B.m", "exception": null, "compileError": false, "explanation": "`A a = new B()` upcasting تلقائي وآمن. `(B) a` downcasting رجّع النوع الفرعي — شغال هنا لأن الكائن runtime بتاعه B فعلًا. `b.m()` بتتنفذ عادي."}, {"id": "casting/q02", "topic": "casting", "topicLabel": "Casting و instanceof", "q": "q02", "title": "Downcasting الغلط بيرمي ClassCastException", "code": "class A {\n}\n\nclass B extends A {\n    void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new A();\n        B b = (B) a;\n        b.m();\n    }\n}\n", "expected": "", "exception": "java.lang.ClassCastException", "compileError": false, "explanation": "الـ cast `(B) a` بيترجم عادي (downcast قانوني)، بس الـ runtime بيتحقق: الكائن `a` نوعه A مش B فبيرمي `ClassCastException` قبل ما توصل `b.m()`."}, {"id": "casting/q03", "topic": "casting", "topicLabel": "Casting و instanceof", "q": "q03", "title": "instanceof قبل الـ Cast", "code": "public class Main {\n    public static void main(String[] args) {\n        Object o = \"hello\";\n        if (o instanceof String) {\n            String s = (String) o;\n            System.out.println(s.length());\n        } else {\n            System.out.println(\"not string\");\n        }\n        Object n = 42;\n        System.out.println(n instanceof String);\n    }\n}\n", "expected": "5\nfalse", "exception": null, "compileError": false, "explanation": "`instanceof` بتشيك الـ runtime type — `o` فعلًا String فالـ cast آمن و`length()` بتطبع 5. `42` مش String فـ `instanceof` بترجع false من غير ما يعمل cast خالص."}, {"id": "casting/q04", "topic": "casting", "topicLabel": "Casting و instanceof", "q": "q04", "title": "Cast بين نوعين مالهمش علاقة", "code": "class A {\n}\n\nclass B {\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new A();\n        B b = (B) a;\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`A` و`B` classes منفصلين — مفيش inheritance بينهم. `(B) a` cast مش ممكن أبدًا لأن مفيش object يقدر يكون الاتنين، فالـ compiler بيرفض بـ \"inconvertible types\"."}, {"id": "casting/q05", "topic": "casting", "topicLabel": "Casting و instanceof", "q": "q05", "title": "الـ Cast لـ Interface بيترجم بس بيفشل runtime", "code": "class A {\n}\n\ninterface I {\n    void m();\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new A();\n        I i = (I) a;\n        i.m();\n    }\n}\n", "expected": "", "exception": "java.lang.ClassCastException", "compileError": false, "explanation": "الكود `(I) a` بيترجم عادي لأن أي class ممكن تكون هتعمل implements للـ interface يومًا — بس A مش هتعمل كده، فالـ runtime بيرمي `ClassCastException` على طول."}, {"id": "casting/q06", "topic": "casting", "topicLabel": "Casting و instanceof", "q": "q06", "title": "instanceof مع null", "code": "public class Main {\n    public static void main(String[] args) {\n        Object o = null;\n        System.out.println(o instanceof String);\n        System.out.println(o instanceof Object);\n    }\n}\n", "expected": "false\nfalse", "exception": null, "compileError": false, "explanation": "`null instanceof أي حاجة` بترجع false دايمًا — null مش object من أي نوع. حتى `instanceof Object` false لأنها مش instance حقيقية."}, {"id": "casting/q07", "topic": "casting", "topicLabel": "Casting و instanceof", "q": "q07", "title": "Type Erasure بيخلي الـ Cast للـ Generics مش آمن", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List raw = new ArrayList();\n        raw.add(\"hello\");\n        List<Integer> nums = (List<Integer>) raw;\n        int n = nums.get(0);\n        System.out.println(n);\n    }\n}\n", "expected": "", "exception": "java.lang.ClassCastException", "compileError": false, "explanation": "الـ cast `(List<Integer>) raw` بيترجم بس مع unchecked warning — الـ generics مش موجودة في الـ runtime. لما `get(0)` بيرجع String والـ assignment لـ `int n` بيحاول unbox String → `ClassCastException`."}, {"id": "collections/q01", "topic": "collections", "topicLabel": "Collections", "q": "q01", "title": "ArrayList بتخزن بالترتيب وبتسمح بالتكرار", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> l = new ArrayList<>();\n        l.add(\"b\");\n        l.add(\"a\");\n        l.add(\"b\");\n        System.out.println(l);\n        System.out.println(l.size());\n        System.out.println(l.get(1));\n    }\n}\n", "expected": "[b, a, b]\n3\na", "exception": null, "compileError": false, "explanation": "`ArrayList` بيحافظ على insertion order وبيسمح بعناصر مكررة — عشان كده `[b, a, b]` فيها 3 عناصر. `toString()` بتاعها بيطبع بالـ brackets والفواصل."}, {"id": "collections/q02", "topic": "collections", "topicLabel": "Collections", "q": "q02", "title": "contains و remove بيعتمدوا على equals", "code": "import java.util.ArrayList;\nimport java.util.List;\n\nclass P {\n    int x;\n\n    P(int x) {\n        this.x = x;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        List<P> l = new ArrayList<>();\n        P p1 = new P(1);\n        l.add(p1);\n        l.add(new P(1));\n        System.out.println(l.contains(new P(1)));\n        System.out.println(l.remove(p1));\n        System.out.println(l.size());\n    }\n}\n", "expected": "false\ntrue\n1", "exception": null, "compileError": false, "explanation": "P معملتش `equals` فبتستخدم `Object.equals` (identity). `contains(new P(1))` بتقارن بالمراجع مش بالقيمة → false. `remove(p1)` بتلاقي نفس الـ object فبتمسحه → true والحجم بينزل لـ 1."}, {"id": "collections/q03", "topic": "collections", "topicLabel": "Collections", "q": "q03", "title": "equals و hashCode بيخلو contains و remove يشتغلوا بالقيمة", "code": "import java.util.ArrayList;\nimport java.util.List;\nimport java.util.Objects;\n\nclass P {\n    int x;\n\n    P(int x) {\n        this.x = x;\n    }\n\n    public boolean equals(Object o) {\n        return o instanceof P && ((P) o).x == x;\n    }\n\n    public int hashCode() {\n        return Objects.hash(x);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        List<P> l = new ArrayList<>();\n        l.add(new P(1));\n        System.out.println(l.contains(new P(1)));\n        System.out.println(l.remove(new P(1)));\n        System.out.println(l.size());\n    }\n}\n", "expected": "true\ntrue\n0", "exception": null, "compileError": false, "explanation": "مع `equals` و`hashCode` متعريفين على `x`، الـ `new P(1)` الجديدة بتساوي القديمة — `contains` بتلاقيها (true) و`remove` بتشيلها (true) فالقائمة بتفضل فاضية."}, {"id": "collections/q04", "topic": "collections", "topicLabel": "Collections", "q": "q04", "title": "Autoboxing + Polymorphism مع Generics", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Number> l = new ArrayList<>();\n        l.add(1);\n        l.add(2.5);\n        l.add(3L);\n        l.add(4);\n        for (Number n : l) {\n            System.out.println(n.getClass().getSimpleName() + \":\" + n);\n        }\n    }\n}\n", "expected": "Integer:1\nDouble:2.5\nLong:3\nInteger:4", "exception": null, "compileError": false, "explanation": "`List<Number>` بيقبل Integer وDouble وLong لأنهم subclasses بتاعة Number — الـ autoboxing بيحول الـ primitives للـ wrapper classes. `getClass()` بيكشف النوع الحقيقي لكل عنصر."}, {"id": "collections/q05", "topic": "collections", "topicLabel": "Collections", "q": "q05", "title": "remove(int) مش remove(Object)", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> l = new ArrayList<>();\n        l.add(\"a\");\n        l.add(\"b\");\n        l.add(\"c\");\n        l.remove(1);\n        System.out.println(l);\n        l.remove(\"a\");\n        System.out.println(l);\n    }\n}\n", "expected": "[a, c]\n[c]", "exception": null, "compileError": false, "explanation": "`l.remove(1)` بينادي `remove(int index)` بيمسح العنصر في الـ index 1 (\"b\") → `[a, c]`. `l.remove(\"a\")` بينادي `remove(Object)` بيمسح بالقيمة → `[c]`. الـ overload بيختار حسب نوع الـ argument."}, {"id": "collections/q06", "topic": "collections", "topicLabel": "Collections", "q": "q06", "title": "Fail-Fast Iterators", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> l = new ArrayList<>();\n        l.add(\"a\");\n        l.add(\"b\");\n        for (String s : l) {\n            if (s.equals(\"a\")) {\n                l.add(\"c\");\n            }\n        }\n    }\n}\n", "expected": "", "exception": "java.util.ConcurrentModificationException", "compileError": false, "explanation": "الـ for-each بيستخدم iterator بيتحقق إن الـ list متغيرتش أثناء الـ iteration. `l.add(\"c\")` جوه اللوب بيغير الـ modCount فـ `next()` بيرمي `ConcurrentModificationException` في اللفة التانية."}, {"id": "collections/q07", "topic": "collections", "topicLabel": "Collections", "q": "q07", "title": "List.of بيرجع List immutable", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<String> l = List.of(\"a\", \"b\");\n        l.add(\"c\");\n    }\n}\n", "expected": "", "exception": "java.lang.UnsupportedOperationException", "compileError": false, "explanation": "`List.of()` بتعمل immutable list — أي محاولة تعديل (`add`, `remove`, `set`) بترمي `UnsupportedOperationException`. لو محتاج تعديل استخدم `new ArrayList<>(List.of(...))`."}, {"id": "collections/q08", "topic": "collections", "topicLabel": "Collections", "q": "q08", "title": "الـ Generics مبتاخدش Primitives", "code": "import java.util.ArrayList;\nimport java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<int> l = new ArrayList<>();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`List<int>` مش قانوني — الـ type arguments لازم تكون reference types. استخدم `List<Integer>` والـ autoboxing هيشتغل معاك تلقائيًا."}, {"id": "exceptions/q01", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q01", "title": "ترتيب قفل الـ Resources", "code": "class R implements AutoCloseable {\n    private final String name;\n\n    R(String name) {\n        this.name = name;\n    }\n\n    public void close() {\n        System.out.println(\"close-\" + name);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        try (R a = new R(\"a\"); R b = new R(\"b\")) {\n            System.out.println(\"body\");\n        }\n    }\n}\n", "expected": "body\nclose-b\nclose-a", "exception": null, "compileError": false, "explanation": "الـ try-with-resources بيقفل الـ resources بترتيب عكسي من إنشائها — `b` اتقفل قبل `a`. الـ close() بينادي حتى لو الـ try خلص عادي أو حصل exception."}, {"id": "exceptions/q02", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q02", "title": "الـ Return في Finally بيعمل Override", "code": "public class Main {\n    static int m() {\n        try {\n            throw new RuntimeException(\"boom\");\n        } catch (Exception e) {\n            System.out.println(\"caught\");\n            return 1;\n        } finally {\n            System.out.println(\"finally\");\n            return 3;\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(m());\n    }\n}\n", "expected": "caught\nfinally\n3", "exception": null, "compileError": false, "explanation": "الـ `return 3` جوه finally بيشتغل آخر حاجة وبيستبدل أي return تاني — حتى اللي في الـ catch. فالنتيجة 3 مش 1، والـ return بتاع الـ catch بيتلغى."}, {"id": "exceptions/q03", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q03", "title": "ترتيب الـ Catch مهم —Subclass الأول", "code": "public class Main {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\"try\");\n        } catch (Exception e) {\n            System.out.println(\"catch-ex\");\n        } catch (RuntimeException e) {\n            System.out.println(\"catch-runtime\");\n        } finally {\n            System.out.println(\"finally\");\n        }\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`RuntimeException` extends `Exception`، فـ `catch (Exception)` قبلها بيلتقط كل حاجة والـ catch التانية مش هتوصلها أبدًا — javac بيرفض \"exception RuntimeException has already been caught\"."}, {"id": "exceptions/q04", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q04", "title": "Checked Exceptions لازم throws", "code": "public class Main {\n    static void m() {\n        throw new Exception(\"checked\");\n    }\n\n    public static void main(String[] args) {\n        m();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`Exception` checked exception — لازم الـ method يعلن `throws Exception` أو يعمل catch ليها. `m()` مش معلنة عن حاجة فـ javac بيفشل بـ \"unreported exception\"."}, {"id": "exceptions/q05", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q05", "title": "الـ Override مينفعش يوسّع الـ throws", "code": "class A {\n    void m() throws java.io.IOException {\n        System.out.println(\"A.m\");\n    }\n}\n\nclass B extends A {\n    void m() throws Exception {\n        System.out.println(\"B.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`B.m` بيعمل override لـ `A.m` اللي معلنة `throws IOException` — بس B بتعلن `throws Exception` الأوسع. ده مش قانوني: الـ override لازم يعلن نفس الـ exceptions أو أقل/أضيق."}, {"id": "exceptions/q06", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q06", "title": "الـ Finally بيشتغل حتى مع Return", "code": "public class Main {\n    static int m() {\n        try {\n            System.out.println(\"try\");\n            return 1;\n        } finally {\n            System.out.println(\"finally\");\n        }\n    }\n\n    public static void main(String[] args) {\n        System.out.println(m());\n    }\n}\n", "expected": "try\nfinally\n1", "exception": null, "compileError": false, "explanation": "الـ `return 1` مش بيخرج فورًا — الـ finally block بيشتغل الأول وبعدين الـ return بيكمل. عشان كده \"finally\" بتتطبع قبل ما الـ method ترجع."}, {"id": "exceptions/q07", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q07", "title": "الـ Catch المش متطابق مش بيمسك الـ Exception", "code": "public class Main {\n    static void m() {\n        try {\n            int[] a = new int[1];\n            a[2] = 5;\n        } catch (NullPointerException e) {\n            System.out.println(\"npe\");\n        }\n    }\n\n    public static void main(String[] args) {\n        m();\n    }\n}\n", "expected": "", "exception": "java.lang.ArrayIndexOutOfBoundsException", "compileError": false, "explanation": "`a[2] = 5` على array طولها 1 بيرمي `ArrayIndexOutOfBoundsException` مش `NullPointerException` — الـ catch الوحيدة مش بتلقطه فبيطلع من الـ method ويقع الـ program."}, {"id": "exceptions/q08", "topic": "exceptions", "topicLabel": "Exceptions", "q": "q08", "title": "Custom Checked Exception", "code": "class MyException extends Exception {\n    MyException(String msg) {\n        super(msg);\n    }\n}\n\npublic class Main {\n    static void risky() throws MyException {\n        System.out.println(\"before\");\n        throw new MyException(\"custom\");\n    }\n\n    public static void main(String[] args) {\n        try {\n            risky();\n        } catch (MyException e) {\n            System.out.println(\"caught: \" + e.getMessage());\n        } finally {\n            System.out.println(\"done\");\n        }\n    }\n}\n", "expected": "before\ncaught: custom\ndone", "exception": null, "compileError": false, "explanation": "`MyException` extends `Exception` فهي checked — لازم `risky()` تعلن `throws MyException` والـ caller يعمل catch. الـ catch بيمسكها بالاسم و`getMessage()` بترجع الرسالة اللي اتبعتت للـ super."}, {"id": "inheritance/q01", "topic": "inheritance", "topicLabel": "وراثة و Constructor Chaining", "q": "q01", "title": "ترتيب الـ Constructors في الوراثة", "code": "class A {\n    A() {\n        System.out.println(\"A-ctor\");\n    }\n}\n\nclass B extends A {\n    B() {\n        System.out.println(\"B-ctor\");\n    }\n}\n\nclass C extends B {\n    C() {\n        System.out.println(\"C-ctor\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new C();\n    }\n}\n", "expected": "A-ctor\nB-ctor\nC-ctor", "exception": null, "compileError": false, "explanation": "لما تعمل `new C()` الـ constructor بتاع C بينادي `super()` على طول قبل أي سطر، فالترتيب دايمًا من فوق لتحت: A وبعدين B وبعدين C."}, {"id": "inheritance/q02", "topic": "inheritance", "topicLabel": "وراثة و Constructor Chaining", "q": "q02", "title": "Field Hiding مع Constructors", "code": "class A {\n    int x = 1;\n\n    A() {\n        x = 2;\n        System.out.println(\"A x=\" + x);\n    }\n}\n\nclass B extends A {\n    int x = 10;\n\n    B() {\n        x = 20;\n        System.out.println(\"B x=\" + x);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "A x=2\nB x=20", "exception": null, "compileError": false, "explanation": "الـ field `x` في B بيعمل hide للـ field في A — دول متغيرين مختلفين. جوه constructor بتاع A بيتكلم عن `x` بتاع A (بقيمة 2)، وجوه constructor بتاع B بيتكلم عن `x` بتاع B (بقيمة 20)."}, {"id": "inheritance/q03", "topic": "inheritance", "topicLabel": "وراثة و Constructor Chaining", "q": "q03", "title": "Constructor بينادي Method متعملها Override", "code": "class A {\n    A() {\n        show();\n    }\n\n    void show() {\n        System.out.println(\"A.show\");\n    }\n}\n\nclass B extends A {\n    B() {\n        super();\n    }\n\n    void show() {\n        System.out.println(\"B.show\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "B.show", "exception": null, "compileError": false, "explanation": "`show()` اتندهت من جوه constructor بتاع A بس الـ dynamic dispatch شغال: الكائن فعليًا من نوع B فالنسخة اللي بتتنفذ هي `B.show`. الحقول بس هي اللي بتتملّى بالترتيب، الـ methods بتتعملها dispatch عادي."}, {"id": "inheritance/q04", "topic": "inheritance", "topicLabel": "وراثة و Constructor Chaining", "q": "q04", "title": "الفرق بين super و this", "code": "class A {\n    void hi() {\n        System.out.println(\"A.hi\");\n    }\n}\n\nclass B extends A {\n    void hi() {\n        System.out.println(\"B.hi\");\n    }\n\n    void test() {\n        super.hi();\n        hi();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B().test();\n    }\n}\n", "expected": "A.hi\nB.hi", "exception": null, "compileError": false, "explanation": "`super.hi()` بينادي نسخة الأب صراحةً حتى لو الـ method متعملها override، بينما `hi()` العادية بتستخدم الـ dynamic dispatch فبتنادي `B.hi`."}, {"id": "inheritance/q05", "topic": "inheritance", "topicLabel": "وراثة و Constructor Chaining", "q": "q05", "title": "مفيش Default Constructor في الأب", "code": "class A {\n    A(int x) {\n    }\n}\n\nclass B extends A {\n    B() {\n        System.out.println(\"hi\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "لما عرّفت `A(int x)` مفيش constructor فاضي اتعمل تلقائيًا في A، فالـ `super()` الضمني اللي في `B()` مش لاقي constructor يناديه — javac بيفشل."}, {"id": "inheritance/q06", "topic": "inheritance", "topicLabel": "وراثة و Constructor Chaining", "q": "q06", "title": "ترتيب الـ Instance Initializer Blocks", "code": "class A {\n    {\n        System.out.println(\"A-init\");\n    }\n\n    A() {\n        System.out.println(\"A-ctor\");\n    }\n}\n\nclass B extends A {\n    {\n        System.out.println(\"B-init\");\n    }\n\n    B() {\n        System.out.println(\"B-ctor\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "A-init\nA-ctor\nB-init\nB-ctor", "exception": null, "compileError": false, "explanation": "الترتيب: `super()` → instance init block بتاع الأب → constructor بتاع الأب → instance init block بتاع الابن → constructor بتاع الابن. الـ init block بيشتغل بعد الـ super() وقبل باقي جسم الـ constructor."}, {"id": "inheritance/q07", "topic": "inheritance", "topicLabel": "وراثة و Constructor Chaining", "q": "q07", "title": "Static Fields بتتعملها Hiding مش Override", "code": "class A {\n    static int v = 1;\n}\n\nclass B extends A {\n    static int v = 2;\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new B();\n        B b = new B();\n        System.out.println(a.v + \" \" + b.v + \" \" + B.v + \" \" + A.v);\n    }\n}\n", "expected": "1 2 2 1", "exception": null, "compileError": false, "explanation": "`B.v` بيعمل hide لـ `A.v` — دول متغيرين منفصلين. الوصول للـ static field بيتحدد من الـ compile-time type: `a` معرّف كـ A فياخد `A.v` رغم إن الكائن B."}, {"id": "inner-classes/q01", "topic": "inner-classes", "topicLabel": "Inner Classes و Enums", "q": "q01", "title": "الـ Inner Class شايلة مرجع للـ Outer", "code": "class Outer {\n    int v = 5;\n\n    class Inner {\n        void show() {\n            System.out.println(v);\n        }\n    }\n\n    Inner make() {\n        return new Inner();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Outer outer = new Outer();\n        outer.make().show();\n    }\n}\n", "expected": "5", "exception": null, "compileError": false, "explanation": "الـ non-static inner class بتحتفظ بـ reference للـ outer object، فبتقدر توصل `v` مباشرة. إنشائها لازم `outer.new Inner()` أو من جوه Outer زي `make()` هنا."}, {"id": "inner-classes/q02", "topic": "inner-classes", "topicLabel": "Inner Classes و Enums", "q": "q02", "title": "الـ Static Nested Class مفيهاش Outer instance", "code": "class Outer {\n    int v = 5;\n\n    static class Nested {\n        void show() {\n            System.out.println(v);\n        }\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Outer.Nested().show();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`Nested` static يعني مفيهاش reference لـ Outer object، فمش هتقدر توصل `v` instance variable. javac بيفشل بـ \"non-static variable v cannot be referenced from a static context\"."}, {"id": "inner-classes/q03", "topic": "inner-classes", "topicLabel": "Inner Classes و Enums", "q": "q03", "title": "Anonymous Class", "code": "interface I {\n    void m();\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        I i = new I() {\n            public void m() {\n                System.out.println(\"anon\");\n            }\n        };\n        i.m();\n    }\n}\n", "expected": "anon", "exception": null, "compileError": false, "explanation": "`new I() { ... }` بتعمل class من غير اسم implements الـ interface على طول. `i.m()` بتستدعي النسخة اللي اتكتبت جوه الـ anonymous class."}, {"id": "inner-classes/q04", "topic": "inner-classes", "topicLabel": "Inner Classes و Enums", "q": "q04", "title": "أساسيات الـ Enum", "code": "enum Color {\n    RED, GREEN, BLUE\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        for (Color c : Color.values()) {\n            System.out.println(c.ordinal() + \":\" + c.name());\n        }\n        System.out.println(Color.valueOf(\"GREEN\"));\n        System.out.println(Color.RED == Color.valueOf(\"RED\"));\n    }\n}\n", "expected": "0:RED\n1:GREEN\n2:BLUE\nGREEN\ntrue", "exception": null, "compileError": false, "explanation": "`values()` بترجع كل الـ constants بالترتيب، `ordinal()` بيرجع الموقع (يبدأ من 0)، و`valueOf` بيدور بالاسم. الـ enum constants objects singleton فـ `==` شغالة معاها."}, {"id": "inner-classes/q05", "topic": "inner-classes", "topicLabel": "Inner Classes و Enums", "q": "q05", "title": "Enum مع Constructor و Fields", "code": "enum Level {\n    LOW(1), MEDIUM(5), HIGH(10);\n\n    final int power;\n\n    Level(int power) {\n        this.power = power;\n    }\n\n    int getPower() {\n        return power;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(Level.HIGH.getPower());\n        System.out.println(Level.LOW == Level.valueOf(\"LOW\"));\n    }\n}\n", "expected": "10\ntrue", "exception": null, "compileError": false, "explanation": "الـ enum يقدر يكون ليه constructor وfields — كل constant بينادي الـ constructor بالقيمة اللي جنبه. `Level.HIGH` عنده power=10 و`getPower()` بترجعها."}, {"id": "inner-classes/q06", "topic": "inner-classes", "topicLabel": "Inner Classes و Enums", "q": "q06", "title": "Local Class جوه Static Method", "code": "class Outer {\n    static void make() {\n        class Local {\n            void m() {\n                System.out.println(\"local\");\n            }\n        }\n        new Local().m();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Outer.make();\n    }\n}\n", "expected": "local", "exception": null, "compileError": false, "explanation": "الـ local class متعرفة جوه method بتشتغل عادي — بتتعمل compile كـ inner class خاصة بالـ method. هنا `make()` static والـ class محلي جواها فمفيش مشكلة."}, {"id": "inner-classes/q07", "topic": "inner-classes", "topicLabel": "Inner Classes و Enums", "q": "q07", "title": "الـ Inner Classes لازم تلتقط effectively final بس", "code": "interface R {\n    void run();\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        int x = 5;\n        x = 10;\n        R r = new R() {\n            public void run() {\n                System.out.println(x);\n            }\n        };\n        r.run();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "الـ anonymous class بتلتقط الـ local variables اللي بتستخدمها — ولازم تكون final أو effectively final. `x` اتغيرت بعد ما اتعملت فـ javac بيرفض."}, {"id": "polymorphism/q01", "topic": "polymorphism", "topicLabel": "Polymorphism", "q": "q01", "title": "Overloading مش Polymorphism", "code": "class A {\n    void m(Object o) {\n        System.out.println(\"Object\");\n    }\n}\n\nclass B extends A {\n    void m(String s) {\n        System.out.println(\"String\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new B();\n        a.m(\"x\");\n        new B().m(\"x\");\n    }\n}\n", "expected": "Object\nString", "exception": null, "compileError": false, "explanation": "`B.m(String)` ده overload جديد مش override، فالـ compiler بيختار الـ method من الـ compile-time type. `a` معرّف كـ A فبيلاقي بس `m(Object)`، بينما `new B()` بيشوف النسختين فيختار `m(String)` كأقرب match."}, {"id": "polymorphism/q02", "topic": "polymorphism", "topicLabel": "Polymorphism", "q": "q02", "title": "Static Methods بتتعملها Hiding", "code": "class A {\n    static void m() {\n        System.out.println(\"A.m\");\n    }\n}\n\nclass B extends A {\n    static void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new B();\n        B b = new B();\n        a.m();\n        b.m();\n    }\n}\n", "expected": "A.m\nB.m", "exception": null, "compileError": false, "explanation": "الـ static methods مبتتعملهاش override — بيتعملها hiding والاختيار بيحصل وقت الـ compile. `a.m()` الـ compiler شايف `a` نوعه A فاختار `A.m` حتى لو الكائن runtime بتاعه B."}, {"id": "polymorphism/q03", "topic": "polymorphism", "topicLabel": "Polymorphism", "q": "q03", "title": "Override Annotation بتتحقق من Override حقيقي", "code": "class A {\n    void m() {\n    }\n}\n\nclass B extends A {\n    @Override\n    void n() {\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`@Override` معناها إن الـ method المفروض تكون بتعمل override لـ method في superclass. `n()` مفيهاش أصل في A فالـ annotation بتفشل الـ compilation."}, {"id": "polymorphism/q04", "topic": "polymorphism", "topicLabel": "Polymorphism", "q": "q04", "title": "اختيار الـ Overload", "code": "class T {\n    void m(int x) {\n        System.out.println(\"int\");\n    }\n\n    void m(long x) {\n        System.out.println(\"long\");\n    }\n\n    void m(String s) {\n        System.out.println(\"String\");\n    }\n\n    void m(Object o) {\n        System.out.println(\"Object\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        T t = new T();\n        t.m(5);\n        t.m(5L);\n        t.m(null);\n    }\n}\n", "expected": "int\nlong\nString", "exception": null, "compileError": false, "explanation": "`m(5)` بيختار `int` (أدق match بدون widening)، `m(5L)` بيختار `long`، و`m(null)` بيختار `String` لأنه أكثر نوع specific — الـ compiler بيختار أضيق نوع ممكن من غير ما يعمل boxing."}, {"id": "polymorphism/q05", "topic": "polymorphism", "topicLabel": "Polymorphism", "q": "q05", "title": "Dynamic Dispatch جوه Array", "code": "class Shape {\n    void area() {\n        System.out.println(\"Shape\");\n    }\n}\n\nclass Circle extends Shape {\n    void area() {\n        System.out.println(\"Circle\");\n    }\n}\n\nclass Square extends Shape {\n    void area() {\n        System.out.println(\"Square\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        Shape[] shapes = {new Circle(), new Square(), new Shape()};\n        for (Shape s : shapes) {\n            s.area();\n        }\n    }\n}\n", "expected": "Circle\nSquare\nShape", "exception": null, "compileError": false, "explanation": "الـ array نوعه `Shape[]` بس كل عنصر runtime بتاعه نوع مختلف. النداء `s.area()` بيحصل runtime على حسب نوع الكائن الفعلي — ده الـ polymorphism الحقيقي."}, {"id": "polymorphism/q06", "topic": "polymorphism", "topicLabel": "Polymorphism", "q": "q06", "title": "Instance Method مينفعش تعمل Override لـ Static", "code": "class A {\n    static void m() {\n    }\n}\n\nclass B extends A {\n    void m() {\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`A.m` static و`B.m` instance بنفس الـ signature — ده مش override قانوني، javac بيرفض: \"overridden method is static\". لازم static يقابل static وinstance يقابل instance."}, {"id": "polymorphism/q07", "topic": "polymorphism", "topicLabel": "Polymorphism", "q": "q07", "title": "الـ Private Methods مبتتعملهاش Override", "code": "class A {\n    private void m() {\n        System.out.println(\"A.m\");\n    }\n\n    void call() {\n        m();\n    }\n}\n\nclass B extends A {\n    void m() {\n        System.out.println(\"B.m\");\n    }\n\n    void callB() {\n        m();\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new B();\n        a.call();\n        new B().callB();\n    }\n}\n", "expected": "A.m\nB.m", "exception": null, "compileError": false, "explanation": "`B.m` مش override لـ `A.m` لأنها private — private members مبتتورثش أصلاً، فهي مجرد method جديدة صدفةً بنفس الاسم. `call()` جوه A بينادي `A.m` دايمًا لأنها بتتشاف جوه A."}, {"id": "static-final-this-super/q01", "topic": "static-final-this-super", "topicLabel": "static و final و this و super", "q": "q01", "title": "ترتيب الـ Static Initialization", "code": "class T {\n    static {\n        System.out.println(\"static-block\");\n    }\n\n    {\n        System.out.println(\"inst-init\");\n    }\n\n    T() {\n        System.out.println(\"ctor\");\n    }\n\n    static T t = new T();\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new T();\n    }\n}\n", "expected": "static-block\ninst-init\nctor\ninst-init\nctor", "exception": null, "compileError": false, "explanation": "أول `new T()` بيحمل الكلاس: الـ static block يشتغل، وسطر `static T t = new T()` بينشئ object فبيشغل inst-init والـ constructor. بعدين الـ `new T()` التانية في main بتشغل inst-init والـ constructor تاني."}, {"id": "static-final-this-super/q02", "topic": "static-final-this-super", "topicLabel": "static و final و this و super", "q": "q02", "title": "Constructor Chaining بـ this()", "code": "class T {\n    T() {\n        this(1);\n        System.out.println(\"noarg\");\n    }\n\n    T(int x) {\n        System.out.println(\"arg\" + x);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new T();\n    }\n}\n", "expected": "arg1\nnoarg", "exception": null, "compileError": false, "explanation": "`this(1)` لازم يكون أول سطر في الـ constructor وبيبعت التنفيذ لـ `T(int)` الأول. لما `T(int)` يخلص، execution بيرجع يكمل باقي جسم `T()`."}, {"id": "static-final-this-super/q03", "topic": "static-final-this-super", "topicLabel": "static و final و this و super", "q": "q03", "title": "الـ Final Method مينفعش تتعملها Override", "code": "class A {\n    final void m() {\n        System.out.println(\"A.m\");\n    }\n}\n\nclass B extends A {\n    void m() {\n        System.out.println(\"B.m\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`final` على method معناها ممنوع أي subclass يعمل override ليها. `B.m` نفس الـ signature فده override غير قانوني وjavac بيفشل."}, {"id": "static-final-this-super/q04", "topic": "static-final-this-super", "topicLabel": "static و final و this و super", "q": "q04", "title": "static مشترك بين كل الـ Instances", "code": "class Counter {\n    static int count = 0;\n    final int id;\n\n    Counter() {\n        count++;\n        this.id = count;\n    }\n\n    void show() {\n        System.out.println(this.id + \" static=\" + Counter.count);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new Counter().show();\n        new Counter().show();\n    }\n}\n", "expected": "1 static=1\n2 static=2", "exception": null, "compileError": false, "explanation": "`count` static يعني نسخة واحدة للكل الـ objects، فبتزيد مع كل constructor call. `id` final instance variable بتتاخد قيمتها مرة واحدة في الـ constructor ومش بتتغير بعدها."}, {"id": "static-final-this-super/q05", "topic": "static-final-this-super", "topicLabel": "static و final و this و super", "q": "q05", "title": "ترتيب تحميل الكلاسات والـ Initialization", "code": "class A {\n    static {\n        System.out.println(\"A-static\");\n    }\n\n    {\n        System.out.println(\"A-init\");\n    }\n\n    A() {\n        System.out.println(\"A-ctor\");\n    }\n}\n\nclass B extends A {\n    static {\n        System.out.println(\"B-static\");\n    }\n\n    {\n        System.out.println(\"B-init\");\n    }\n\n    B() {\n        System.out.println(\"B-ctor\");\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(\"main\");\n        new B();\n    }\n}\n", "expected": "main\nA-static\nB-static\nA-init\nA-ctor\nB-init\nB-ctor", "exception": null, "compileError": false, "explanation": "أول `println(\"main\")` بيشتغل عادي. لما `new B()` يحتاج تحميل B، الـ JVM بيحمل ويعمل initialize للـ superclass A الأول: static blocks بتاعة A وبعدين B. بعد كده الـ instance init والـ constructors بالترتيب A ثم B."}, {"id": "static-final-this-super/q06", "topic": "static-final-this-super", "topicLabel": "static و final و this و super", "q": "q06", "title": "this.v مقابل super.v", "code": "class A {\n    int v = 1;\n}\n\nclass B extends A {\n    int v = 2;\n\n    void show() {\n        System.out.println(v + \" \" + this.v + \" \" + super.v);\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B().show();\n    }\n}\n", "expected": "2 2 1", "exception": null, "compileError": false, "explanation": "`v` و`this.v` بيشاوروا على `B.v` (اللي عمل hide لـ `A.v`)، بينما `super.v` بيوصل صراحة لنسخة الأب. الثلاثة outputs: 2، 2، 1."}, {"id": "static-final-this-super/q07", "topic": "static-final-this-super", "topicLabel": "static و final و this و super", "q": "q07", "title": "الـ Final Class مينفعش تتورث", "code": "final class A {\n}\n\nclass B extends A {\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        new B();\n    }\n}\n", "expected": "COMPILE_ERROR", "exception": null, "compileError": true, "explanation": "`final` على class معناها ممنوع أي class تعمل `extends` ليها. `B extends A` هنا غير قانوني وjavac بيفشل."}, {"id": "strings-equals/q01", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q01", "title": "String Pool vs new String", "code": "public class Main {\n    public static void main(String[] args) {\n        String a = \"hi\";\n        String b = \"hi\";\n        String c = new String(\"hi\");\n        System.out.println(a == b);\n        System.out.println(a == c);\n        System.out.println(a.equals(c));\n    }\n}\n", "expected": "true\nfalse\ntrue", "exception": null, "compileError": false, "explanation": "الـ literals \"hi\" بيشاوروا على نفس الـ object في الـ String pool فـ `==` بتدي true. `new String` بيعمل object جديد فالـ `==` بتدي false رغم إن `equals` بتقول إن المحتوى واحد."}, {"id": "strings-equals/q02", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q02", "title": "Integer Cache و Autoboxing", "code": "public class Main {\n    public static void main(String[] args) {\n        Integer a = 127;\n        Integer b = 127;\n        Integer c = 128;\n        Integer d = 128;\n        int e = 128;\n        System.out.println(a == b);\n        System.out.println(c == d);\n        System.out.println(c == e);\n        System.out.println(c.equals(d));\n    }\n}\n", "expected": "true\nfalse\ntrue\ntrue", "exception": null, "compileError": false, "explanation": "القيم من -128 لـ 127 بتتخزن في cache فالـ `==` بتشتغل معاها (true). 128 بره الـ cache فبتاخد objects مختلفة (false). `c == e` بينجح لأن `e` int بيunbox للـ Integer فالمقارنة بالقيمة."}, {"id": "strings-equals/q03", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q03", "title": "String immutable و StringBuilder mutable", "code": "public class Main {\n    public static void main(String[] args) {\n        String s = \"a\";\n        s.concat(\"b\");\n        System.out.println(s);\n        StringBuilder sb = new StringBuilder(\"a\");\n        sb.append(\"b\");\n        System.out.println(sb.toString());\n    }\n}\n", "expected": "a\nab", "exception": null, "compileError": false, "explanation": "`concat` بيرجع String جديد ومش بيغير `s` — لازم `s = s.concat(\"b\")`. الـ StringBuilder بيغير نفسه في مكانه فـ `append` بيأثر على طول."}, {"id": "strings-equals/q04", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q04", "title": "equals من غير hashCode مش كفاية", "code": "import java.util.HashSet;\n\nclass P {\n    int x;\n\n    P(int x) {\n        this.x = x;\n    }\n\n    public boolean equals(Object o) {\n        return o instanceof P && ((P) o).x == x;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        HashSet<P> set = new HashSet<>();\n        set.add(new P(1));\n        set.add(new P(1));\n        set.add(new P(2));\n        System.out.println(set.size());\n    }\n}\n", "expected": "3", "exception": null, "compileError": false, "explanation": "الـ HashSet بيستخدم `hashCode()` الأول عشان يحدد الـ bucket — وبما إن P معملتش `hashCode()` فالـ objects بتاخد hash مختلف حتى لو `equals` بتقول true. النتيجة: التلاتة بيتحفظوا كعناصر منفصلة."}, {"id": "strings-equals/q05", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q05", "title": "Java Pass-by-Value", "code": "public class Main {\n    static void change(String s) {\n        s = \"changed\";\n    }\n\n    public static void main(String[] args) {\n        String s = \"orig\";\n        change(s);\n        System.out.println(s);\n    }\n}\n", "expected": "orig", "exception": null, "compileError": false, "explanation": "الـ parameter `s` جوه `change` هو نسخة من الـ reference — إعادة تعيينه مش بتأثر على الـ variable في `main`. عشان تغير String لازم ترجع قيمة جديدة."}, {"id": "strings-equals/q06", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q06", "title": "equals لازم تكون Symmetric", "code": "class A {\n    public boolean equals(Object o) {\n        return o instanceof A;\n    }\n}\n\nclass B extends A {\n    public boolean equals(Object o) {\n        return o instanceof B;\n    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n        A a = new A();\n        B b = new B();\n        System.out.println(a.equals(b));\n        System.out.println(b.equals(a));\n    }\n}\n", "expected": "true\nfalse", "exception": null, "compileError": false, "explanation": "`a.equals(b)` بتشيك `b instanceof A` → true (لأن B extends A). `b.equals(a)` بتشيك `a instanceof B` → false. ده كسر لقاعدة الـ symmetry في equals contract — علامة إن `instanceof` لوحده مش كفاية مع الوراثة."}, {"id": "strings-equals/q07", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q07", "title": "Compile-Time Constants بتتعملها Pooling", "code": "public class Main {\n    public static void main(String[] args) {\n        String a = \"ab\";\n        String b = \"a\" + \"b\";\n        String c = new String(\"ab\");\n        String d = \"a\" + new String(\"b\");\n        System.out.println(a == b);\n        System.out.println(a == c);\n        System.out.println(a == d);\n        System.out.println(a.equals(d));\n    }\n}\n", "expected": "true\nfalse\nfalse\ntrue", "exception": null, "compileError": false, "explanation": "`\"a\" + \"b\"` كلهم literals فـ javac بيحسبهم compile-time constant وبيرجع نفس الـ pooled object (true). `new String(\"ab\")` و`\"a\" + new String(\"b\")` بيتعملهم runtime objects جديدة فالـ `==` false رغم إن `equals` true."}, {"id": "strings-equals/q08", "topic": "strings-equals", "topicLabel": "String و equals و hashCode", "q": "q08", "title": "String Concat مع null", "code": "public class Main {\n    public static void main(String[] args) {\n        String s = null;\n        System.out.println(\"x\" + s);\n        System.out.println(s + \"x\");\n        System.out.println(s == null);\n    }\n}\n", "expected": "xnull\nnullx\ntrue", "exception": null, "compileError": false, "explanation": "`\"x\" + null` مش NullPointerException — الـ compiler بيحوّل الـ null لـ \"null\" كنص. `s == null` بيطبع true عادي لأن المقارنة بالمرجع مش بتلمس القيمة."}], "coding": [{"id": "bank-account", "name": "bank account", "problem": "# مسألة: BankAccount\n\nابني كلاس حساب بنكي مع custom exception.\n\n## المطلوب\n\n- `class InsufficientFundsException extends Exception` — constructor بياخد `String message` و بينادي `super(message)`.\n- `class BankAccount` فيها:\n  - `private double balance`\n  - `BankAccount(double initialBalance)`\n  - `void deposit(double amount)` — بتزود الرصيد (افترض amount موجب)\n  - `void withdraw(double amount) throws InsufficientFundsException` — بتنقص الرصيد، ولو `amount > balance` بترمي `InsufficientFundsException(\"Insufficient funds\")`\n  - `double getBalance()`\n\n## نصيحة\n\n- `InsufficientFundsException` checked exception — لازم تعلن `throws` في `withdraw` وأي حد بيناديها يعمل `try/catch`.\n- `Tests.java` بيجرب السحب العادي والسحب اللي أكبر من الرصيد — شغّله قبل التسليم.\n", "starter": "class InsufficientFundsException extends Exception {\n    InsufficientFundsException(String message) {\n        // TODO: call super(message)\n    }\n}\n\nclass BankAccount {\n    private double balance;\n\n    BankAccount(double initialBalance) {\n        this.balance = initialBalance;\n    }\n\n    void deposit(double amount) {\n        // TODO: add amount to balance\n    }\n\n    void withdraw(double amount) throws InsufficientFundsException {\n        // TODO: subtract amount, or throw InsufficientFundsException\n    }\n\n    double getBalance() {\n        // TODO: return balance\n        return 0;\n    }\n}\n", "solution": "class InsufficientFundsException extends Exception {\n    InsufficientFundsException(String message) {\n        super(message);\n    }\n}\n\nclass BankAccount {\n    private double balance;\n\n    BankAccount(double initialBalance) {\n        this.balance = initialBalance;\n    }\n\n    void deposit(double amount) {\n        balance += amount;\n    }\n\n    void withdraw(double amount) throws InsufficientFundsException {\n        if (amount > balance) {\n            throw new InsufficientFundsException(\"Insufficient funds\");\n        }\n        balance -= amount;\n    }\n\n    double getBalance() {\n        return balance;\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    static void checkClose(double actual, double expected, String name) {\n        check(Math.abs(actual - expected) < 1e-9, name + \" (got \" + actual + \")\");\n    }\n\n    public static void main(String[] args) {\n        BankAccount acc = new BankAccount(100);\n        checkClose(acc.getBalance(), 100, \"initial balance\");\n\n        acc.deposit(50);\n        checkClose(acc.getBalance(), 150, \"after deposit\");\n\n        try {\n            acc.withdraw(30);\n            checkClose(acc.getBalance(), 120, \"after withdraw\");\n        } catch (InsufficientFundsException e) {\n            check(false, \"withdraw 30 should not throw\");\n        }\n\n        boolean threw = false;\n        try {\n            acc.withdraw(500);\n        } catch (InsufficientFundsException e) {\n            threw = true;\n            check(\"Insufficient funds\".equals(e.getMessage()), \"exception message\");\n        }\n        check(threw, \"overdraft throws InsufficientFundsException\");\n        checkClose(acc.getBalance(), 120, \"balance unchanged after failed withdraw\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "library", "name": "library", "problem": "# مسألة: Library System\n\nابني نظام مكتبة بسيط بـ `ArrayList` — إضافة كتب، بحث بالعنوان، وحذف.\n\n## المطلوب\n\n- `class Book` فيها `private final String title` و `private final String author` و constructor و `getTitle()` و `getAuthor()`.\n- `class Library` فيها `private final List<Book> books = new ArrayList<>()` و methods:\n  - `void addBook(Book book)`\n  - `Book findByTitle(String title)` — بيرجع أول كتاب عنوانه يساوي الـ title (case-sensitive)، أو `null` لو مش موجود\n  - `boolean removeBook(String title)` — بيمسح أول كتاب بنفس العنوان ويرجع true، أو false لو مش موجود\n  - `int count()` — عدد الكتب\n\n## نصيحة\n\n- `findByTitle` و `removeBook` — فكر في `equals` على Strings للـ title.\n- `removeBook` ممكن تستخدم `removeIf` أو iterator أو loop عادي — أي طريقة صح.\n- `Tests.java` بيجرب كل العمليات بما فيها البحث عن كتاب مش موجود.\n", "starter": "class Book {\n    private final String title;\n    private final String author;\n\n    Book(String title, String author) {\n        this.title = title;\n        this.author = author;\n    }\n\n    String getTitle() {\n        // TODO\n        return \"\";\n    }\n\n    String getAuthor() {\n        // TODO\n        return \"\";\n    }\n}\n\nclass Library {\n    // TODO: books list field\n\n    void addBook(Book book) {\n        // TODO\n    }\n\n    Book findByTitle(String title) {\n        // TODO: return matching book or null\n        return null;\n    }\n\n    boolean removeBook(String title) {\n        // TODO: remove first matching book, return true if removed\n        return false;\n    }\n\n    int count() {\n        // TODO\n        return 0;\n    }\n}\n", "solution": "import java.util.ArrayList;\nimport java.util.List;\n\nclass Book {\n    private final String title;\n    private final String author;\n\n    Book(String title, String author) {\n        this.title = title;\n        this.author = author;\n    }\n\n    String getTitle() {\n        return title;\n    }\n\n    String getAuthor() {\n        return author;\n    }\n}\n\nclass Library {\n    private final List<Book> books = new ArrayList<>();\n\n    void addBook(Book book) {\n        books.add(book);\n    }\n\n    Book findByTitle(String title) {\n        for (Book b : books) {\n            if (b.getTitle().equals(title)) {\n                return b;\n            }\n        }\n        return null;\n    }\n\n    boolean removeBook(String title) {\n        for (int i = 0; i < books.size(); i++) {\n            if (books.get(i).getTitle().equals(title)) {\n                books.remove(i);\n                return true;\n            }\n        }\n        return false;\n    }\n\n    int count() {\n        return books.size();\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        Library lib = new Library();\n        check(lib.count() == 0, \"empty library count\");\n\n        Book b1 = new Book(\"Clean Code\", \"Robert Martin\");\n        Book b2 = new Book(\"Effective Java\", \"Joshua Bloch\");\n        lib.addBook(b1);\n        lib.addBook(b2);\n        lib.addBook(new Book(\"Clean Code\", \"Someone Else\"));\n\n        check(lib.count() == 3, \"count after adding 3 books\");\n        check(lib.findByTitle(\"Effective Java\") == b2, \"findByTitle returns the book\");\n        check(lib.findByTitle(\"Missing\") == null, \"findByTitle missing returns null\");\n        check(\"Clean Code\".equals(lib.findByTitle(\"Clean Code\").getTitle()),\n                \"findByTitle finds first match\");\n\n        check(lib.removeBook(\"Clean Code\"), \"removeBook existing returns true\");\n        check(lib.count() == 2, \"count after remove\");\n        check(\"Someone Else\".equals(lib.findByTitle(\"Clean Code\").getAuthor()),\n                \"removeBook removed only the first match\");\n        check(!lib.removeBook(\"Nope\"), \"removeBook missing returns false\");\n        check(lib.count() == 2, \"count unchanged after failed remove\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "payroll", "name": "payroll", "problem": "# مسألة: Employee / Manager Payroll\n\nابني نظام مرتبات بـ polymorphism — كل نوع employee ليه طريقة حساب مختلفة للـ salary.\n\n## المطلوب\n\n- `class Employee` فيها `protected String name` و `protected double baseSalary` و constructor بياخدهم، و `double getSalary()` بترجع `baseSalary`.\n- `class Manager extends Employee` فيها `private double bonus` زيادة على الـ base، و `getSalary()` بترجع `baseSalary + bonus`.\n- `static double payroll(Employee[] employees)` — بترجع مجموع `getSalary()` لكل الموظفين.\n\n## نصيحة\n\n- حط `payroll` جوه class `Payroll` لو حابب، أو اعملها static في أي حتة — المهم الـ Tests تلاقيها.\n- الـ polymorphism هنا إن `payroll` بتتعامل مع الكل كـ `Employee` بس كل واحد بيرجع مرتبه الصح.\n", "starter": "class Employee {\n    protected String name;\n    protected double baseSalary;\n\n    Employee(String name, double baseSalary) {\n        this.name = name;\n        this.baseSalary = baseSalary;\n    }\n\n    double getSalary() {\n        // TODO: return baseSalary\n        return 0;\n    }\n}\n\nclass Manager extends Employee {\n    private double bonus;\n\n    Manager(String name, double baseSalary, double bonus) {\n        super(name, baseSalary);\n        this.bonus = bonus;\n    }\n\n    double getSalary() {\n        // TODO: return baseSalary + bonus\n        return 0;\n    }\n}\n\nclass Payroll {\n    static double payroll(Employee[] employees) {\n        // TODO: sum getSalary() over all employees\n        return 0;\n    }\n}\n", "solution": "class Employee {\n    protected String name;\n    protected double baseSalary;\n\n    Employee(String name, double baseSalary) {\n        this.name = name;\n        this.baseSalary = baseSalary;\n    }\n\n    double getSalary() {\n        return baseSalary;\n    }\n}\n\nclass Manager extends Employee {\n    private double bonus;\n\n    Manager(String name, double baseSalary, double bonus) {\n        super(name, baseSalary);\n        this.bonus = bonus;\n    }\n\n    double getSalary() {\n        return baseSalary + bonus;\n    }\n}\n\nclass Payroll {\n    static double payroll(Employee[] employees) {\n        double total = 0;\n        for (Employee e : employees) {\n            total += e.getSalary();\n        }\n        return total;\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    static void checkClose(double actual, double expected, String name) {\n        check(Math.abs(actual - expected) < 1e-9, name + \" (got \" + actual + \")\");\n    }\n\n    public static void main(String[] args) {\n        Employee emp = new Employee(\"Sara\", 5000);\n        Manager mgr = new Manager(\"Omar\", 8000, 2000);\n\n        checkClose(emp.getSalary(), 5000, \"employee salary\");\n        checkClose(mgr.getSalary(), 10000, \"manager salary includes bonus\");\n\n        Employee[] staff = {emp, mgr, new Employee(\"Laila\", 3000)};\n        checkClose(Payroll.payroll(staff), 18000, \"payroll total\");\n\n        checkClose(Payroll.payroll(new Employee[0]), 0, \"empty payroll\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "point-equals", "name": "point equals", "problem": "# مسألة: Point equals و hashCode\n\nابني كلاس `Point` يشتغل صح مع `equals` و `hashCode` و `HashSet`.\n\n## المطلوب\n\n- `class Point` فيها `private final int x` و `private final int y` و constructor `Point(int x, int y)`.\n- `equals(Object o)` — بترجع true لو `o` Point ونفس `x` و `y`. استخدم `instanceof` و cast.\n- `hashCode()` — لازم تكون متسقة مع equals (نقطتين متساويتين → نفس الـ hashCode). استخدم `Objects.hash(x, y)` أو دمج يدوي.\n- `toString()` — أي format مقروء، مثلاً `\"Point(3, 4)\"`.\n\n## نصيحة\n\n- `equals` لازم يكون `public` وبتاخد `Object` مش `Point` — وإلا مش هتشتغل مع الـ collections.\n- `Tests.java` بيجرب `HashSet` — لو `hashCode` مش متسقة هتلاقي duplicates.\n", "starter": "import java.util.Objects;\n\nclass Point {\n    private final int x;\n    private final int y;\n\n    Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    public boolean equals(Object o) {\n        // TODO: compare x and y\n        return false;\n    }\n\n    public int hashCode() {\n        // TODO: consistent with equals\n        return 0;\n    }\n\n    public String toString() {\n        // TODO\n        return \"\";\n    }\n}\n", "solution": "import java.util.Objects;\n\nclass Point {\n    private final int x;\n    private final int y;\n\n    Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    public boolean equals(Object o) {\n        if (this == o) {\n            return true;\n        }\n        if (!(o instanceof Point)) {\n            return false;\n        }\n        Point p = (Point) o;\n        return x == p.x && y == p.y;\n    }\n\n    public int hashCode() {\n        return Objects.hash(x, y);\n    }\n\n    public String toString() {\n        return \"Point(\" + x + \", \" + y + \")\";\n    }\n}\n", "tests": "import java.util.HashSet;\nimport java.util.Set;\n\npublic class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        Point p1 = new Point(3, 4);\n        Point p2 = new Point(3, 4);\n        Point p3 = new Point(3, 5);\n\n        check(p1.equals(p1), \"equals reflexive\");\n        check(p1.equals(p2), \"equals same coords\");\n        check(!p1.equals(p3), \"equals different y\");\n        check(!p1.equals(null), \"equals null\");\n        check(!p1.equals(\"not a point\"), \"equals wrong type\");\n        check(p2.equals(p1), \"equals symmetric\");\n\n        check(p1.hashCode() == p2.hashCode(), \"hashCode consistent with equals\");\n        check(p1.toString().equals(\"Point(3, 4)\"), \"toString format\");\n\n        Set<Point> set = new HashSet<>();\n        set.add(p1);\n        set.add(p2);\n        set.add(p3);\n        check(set.size() == 2, \"HashSet dedups equal points\");\n        check(set.contains(new Point(3, 4)), \"HashSet contains equal point\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "shape-hierarchy", "name": "shape hierarchy", "problem": "# مسألة: Shape Hierarchy\n\nابني hierarchy للـ shapes باستخدام abstract class و polymorphism.\n\n## المطلوب\n\n- `abstract class Shape` فيها `abstract double area()`.\n- `class Circle extends Shape` — constructor بياخد `radius` و `area()` بترجع `Math.PI * r * r`.\n- `class Rectangle extends Shape` — constructor بياخد `width` و `height` و `area()` بترجع `width * height`.\n\n## نصيحة\n\n- `Starter.java` فيه الـ skeleton — كمّل الـ TODOs بس.\n- `Tests.java` بتشيك المساحات الكلية والـ polymorphic dispatch — شغّلها بنفسك قبل ما تسلّم.\n", "starter": "abstract class Shape {\n    abstract double area();\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    Circle(double radius) {\n        this.radius = radius;\n    }\n\n    double area() {\n        // TODO: return the circle area\n        return 0;\n    }\n}\n\nclass Rectangle extends Shape {\n    private final double width;\n    private final double height;\n\n    Rectangle(double width, double height) {\n        this.width = width;\n        this.height = height;\n    }\n\n    double area() {\n        // TODO: return the rectangle area\n        return 0;\n    }\n}\n", "solution": "abstract class Shape {\n    abstract double area();\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    Circle(double radius) {\n        this.radius = radius;\n    }\n\n    double area() {\n        return Math.PI * radius * radius;\n    }\n}\n\nclass Rectangle extends Shape {\n    private final double width;\n    private final double height;\n\n    Rectangle(double width, double height) {\n        this.width = width;\n        this.height = height;\n    }\n\n    double area() {\n        return width * height;\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    static void checkClose(double actual, double expected, String name) {\n        check(Math.abs(actual - expected) < 1e-9, name + \" (got \" + actual + \")\");\n    }\n\n    public static void main(String[] args) {\n        Shape[] shapes = {new Circle(1), new Rectangle(2, 3), new Circle(2)};\n\n        checkClose(shapes[0].area(), Math.PI, \"circle r=1 area\");\n        checkClose(shapes[1].area(), 6.0, \"rectangle 2x3 area\");\n        checkClose(shapes[2].area(), 4 * Math.PI, \"circle r=2 area\");\n\n        double total = 0;\n        for (Shape s : shapes) {\n            total += s.area();\n        }\n        checkClose(total, 5 * Math.PI + 6, \"polymorphic total\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "stack", "name": "stack", "problem": "# مسألة: Stack بـ Interface\n\nابني Stack بسيط باستخدام interface + implementation.\n\n## المطلوب\n\n- `interface IntStack` فيها:\n  - `void push(int value)`\n  - `int pop()` — بيرمي `java.util.EmptyStackException` لو الـ stack فاضي\n  - `boolean isEmpty()`\n  - `int size()`\n- `class ArrayStack implements IntStack` — implementation بـ array ثابت الحجم (مثلاً 10 عناصر) و index للـ top.\n\n## نصيحة\n\n- `pop` لازم ترجع آخر عنصر اتعمله push (LIFO) — عكس الـ queue.\n- `Tests.java` بيجرب الترتيب وبيشيك إن الـ pop على stack فاضي بيرمي الـ exception.\n", "starter": "import java.util.EmptyStackException;\n\ninterface IntStack {\n    void push(int value);\n\n    int pop() throws EmptyStackException;\n\n    boolean isEmpty();\n\n    int size();\n}\n\nclass ArrayStack implements IntStack {\n    private final int[] data = new int[10];\n    private int top = 0;\n\n    public void push(int value) {\n        // TODO: store value and move top\n    }\n\n    public int pop() {\n        // TODO: return last pushed value, throw EmptyStackException if empty\n        return 0;\n    }\n\n    public boolean isEmpty() {\n        // TODO\n        return true;\n    }\n\n    public int size() {\n        // TODO\n        return 0;\n    }\n}\n", "solution": "import java.util.EmptyStackException;\n\ninterface IntStack {\n    void push(int value);\n\n    int pop() throws EmptyStackException;\n\n    boolean isEmpty();\n\n    int size();\n}\n\nclass ArrayStack implements IntStack {\n    private final int[] data = new int[10];\n    private int top = 0;\n\n    public void push(int value) {\n        data[top++] = value;\n    }\n\n    public int pop() {\n        if (isEmpty()) {\n            throw new EmptyStackException();\n        }\n        return data[--top];\n    }\n\n    public boolean isEmpty() {\n        return top == 0;\n    }\n\n    public int size() {\n        return top;\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        IntStack stack = new ArrayStack();\n\n        check(stack.isEmpty(), \"new stack is empty\");\n        check(stack.size() == 0, \"new stack size 0\");\n\n        stack.push(1);\n        stack.push(2);\n        stack.push(3);\n\n        check(!stack.isEmpty(), \"stack not empty after pushes\");\n        check(stack.size() == 3, \"size after 3 pushes\");\n\n        check(stack.pop() == 3, \"pop returns last pushed (LIFO)\");\n        check(stack.pop() == 2, \"second pop\");\n        check(stack.pop() == 1, \"third pop\");\n        check(stack.isEmpty(), \"empty after popping all\");\n\n        boolean threw = false;\n        try {\n            stack.pop();\n        } catch (java.util.EmptyStackException e) {\n            threw = true;\n        }\n        check(threw, \"pop on empty throws EmptyStackException\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}]};
const KEY = "javaOopQuizV1";
function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if(!raw || typeof raw !== "object") return {answers:{}, order:[], reviewOnly:false};
    const validIds = new Set(DATA.questions.map(q=>q.id));
    const answers = {};
    if(raw.answers && typeof raw.answers === "object"){
      for(const id of Object.keys(raw.answers)){
        const a = raw.answers[id];
        if(validIds.has(id) && a && typeof a === "object" && typeof a.correct === "boolean") answers[id] = a;
      }
    }
    const order = Array.isArray(raw.order) ? raw.order.filter(id=>validIds.has(id)) : [];
    return {answers, order, reviewOnly: !!raw.reviewOnly};
  }catch(e){ return {answers:{}, order:[], reviewOnly:false}; }
}
let state = loadState();
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function answerText(q){
  if(q.compileError) return "COMPILE_ERROR";
  if(q.exception) return "EXCEPTION=" + q.exception + "\n" + q.expected;
  return q.expected;
}
const $ = id => document.getElementById(id);
const norm = s => (s||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/\n+$/,"");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const KEYWORDS = new Set(("abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record sealed permits yield").split(" "));
function highlight(src){
  let out="", i=0, n=src.length;
