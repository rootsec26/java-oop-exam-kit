 أول يوم في الشهر، **0 = الأحد** لحد **6 = السبت**. `getStartDay(1800, 1)` = 3 (أربعاء). المعادلة: `(3 + getTotalNumOfDays(year, month)) % 7`.\n- `static String getMonthName(int month)` — اسم الشهر بالإنجليزي: `\"January\"` لـ 1 لحد `\"December\"` لـ 12.\n\n## نصايح\n\n- `isLeapYear`: `year % 4 == 0 && (year % 100 != 0 || year % 400 == 0)`.\n- `getNumOfDaysInMonth`: array أو switch بالأطوال {31,28/29,31,30,...}.\n- `getTotalNumOfDays`: لوب على السنين من 1800 لـ year-1 تجمع أيام كل سنة (365 أو 366)، وبعدين لوب على الشهور من 1 لـ month-1 في السنة دي.\n- `getStartDay`: 1/1/1800 كان أربعاء — لو `totalNumOfDays` هو عدد الأيام بعده، فـ `(3 + total) % 7` بيديك اليوم.\n", "starter": "class CalendarUtils {\n    static boolean isLeapYear(int year) {\n        // TODO\n        return false;\n    }\n\n    static int getNumOfDaysInMonth(int year, int month) {\n        // TODO\n        return 0;\n    }\n\n    static int getTotalNumOfDays(int year, int month) {\n        // TODO\n        return 0;\n    }\n\n    static int getStartDay(int year, int month) {\n        // TODO\n        return 0;\n    }\n\n    static String getMonthName(int month) {\n        // TODO\n        return \"\";\n    }\n}\n", "solution": "class CalendarUtils {\n    static final int[] DAYS = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n    static final String[] NAMES = {\n        \"January\", \"February\", \"March\", \"April\", \"May\", \"June\",\n        \"July\", \"August\", \"September\", \"October\", \"November\", \"December\"\n    };\n\n    static boolean isLeapYear(int year) {\n        return year % 4 == 0 && (year % 100 != 0 || year % 400 == 0);\n    }\n\n    static int getNumOfDaysInMonth(int year, int month) {\n        if (month == 2 && isLeapYear(year)) {\n            return 29;\n        }\n        return DAYS[month - 1];\n    }\n\n    static int getTotalNumOfDays(int year, int month) {\n        int total = 0;\n        for (int y = 1800; y < year; y++) {\n            total += isLeapYear(y) ? 366 : 365;\n        }\n        for (int m = 1; m < month; m++) {\n            total += getNumOfDaysInMonth(year, m);\n        }\n        return total;\n    }\n\n    static int getStartDay(int year, int month) {\n        return (3 + getTotalNumOfDays(year, month)) % 7;\n    }\n\n    static String getMonthName(int month) {\n        return NAMES[month - 1];\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        check(CalendarUtils.isLeapYear(2000), \"leap 2000\");\n        check(CalendarUtils.isLeapYear(2004), \"leap 2004\");\n        check(!CalendarUtils.isLeapYear(1900), \"not leap 1900\");\n        check(!CalendarUtils.isLeapYear(1800), \"not leap 1800\");\n        check(!CalendarUtils.isLeapYear(2023), \"not leap 2023\");\n\n        check(CalendarUtils.getNumOfDaysInMonth(2024, 2) == 29, \"Feb leap\");\n        check(CalendarUtils.getNumOfDaysInMonth(2023, 2) == 28, \"Feb normal\");\n        check(CalendarUtils.getNumOfDaysInMonth(1900, 2) == 28, \"Feb 1900\");\n        check(CalendarUtils.getNumOfDaysInMonth(2023, 1) == 31, \"Jan 31\");\n        check(CalendarUtils.getNumOfDaysInMonth(2023, 4) == 30, \"Apr 30\");\n        check(CalendarUtils.getNumOfDaysInMonth(2023, 12) == 31, \"Dec 31\");\n\n        check(CalendarUtils.getTotalNumOfDays(1800, 1) == 0, \"total 1800/1\");\n        check(CalendarUtils.getTotalNumOfDays(1800, 2) == 31, \"total 1800/2\");\n        check(CalendarUtils.getTotalNumOfDays(1800, 3) == 59, \"total 1800/3\");\n        check(CalendarUtils.getTotalNumOfDays(1801, 1) == 365, \"total 1801/1\");\n        check(CalendarUtils.getTotalNumOfDays(2000, 1) > 0, \"total 2000/1 positive\");\n\n        check(CalendarUtils.getStartDay(1800, 1) == 3, \"startDay Jan1800=Wed\");\n        check(CalendarUtils.getStartDay(1800, 2) == 6, \"startDay Feb1800=Sat\");\n        check(CalendarUtils.getStartDay(1801, 1) == 4, \"startDay Jan1801=Thu\");\n        check(CalendarUtils.getStartDay(2024, 1) == 1, \"startDay Jan2024=Mon\");\n\n        check(CalendarUtils.getMonthName(1).equals(\"January\"), \"name 1\");\n        check(CalendarUtils.getMonthName(2).equals(\"February\"), \"name 2\");\n        check(CalendarUtils.getMonthName(12).equals(\"December\"), \"name 12\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "library", "name": "library", "problem": "# مسألة: Library System\n\nابني نظام مكتبة بسيط بـ `ArrayList` — إضافة كتب، بحث بالعنوان، وحذف.\n\n## المطلوب\n\n- `class Book` فيها `private final String title` و `private final String author` و constructor و `getTitle()` و `getAuthor()`.\n- `class Library` فيها `private final List<Book> books = new ArrayList<>()` و methods:\n  - `void addBook(Book book)`\n  - `Book findByTitle(String title)` — بيرجع أول كتاب عنوانه يساوي الـ title (case-sensitive)، أو `null` لو مش موجود\n  - `boolean removeBook(String title)` — بيمسح أول كتاب بنفس العنوان ويرجع true، أو false لو مش موجود\n  - `int count()` — عدد الكتب\n\n## نصيحة\n\n- `findByTitle` و `removeBook` — فكر في `equals` على Strings للـ title.\n- `removeBook` ممكن تستخدم `removeIf` أو iterator أو loop عادي — أي طريقة صح.\n- `Tests.java` بيجرب كل العمليات بما فيها البحث عن كتاب مش موجود.\n", "starter": "class Book {\n    private final String title;\n    private final String author;\n\n    Book(String title, String author) {\n        this.title = title;\n        this.author = author;\n    }\n\n    String getTitle() {\n        // TODO\n        return \"\";\n    }\n\n    String getAuthor() {\n        // TODO\n        return \"\";\n    }\n}\n\nclass Library {\n    // TODO: books list field\n\n    void addBook(Book book) {\n        // TODO\n    }\n\n    Book findByTitle(String title) {\n        // TODO: return matching book or null\n        return null;\n    }\n\n    boolean removeBook(String title) {\n        // TODO: remove first matching book, return true if removed\n        return false;\n    }\n\n    int count() {\n        // TODO\n        return 0;\n    }\n}\n", "solution": "import java.util.ArrayList;\nimport java.util.List;\n\nclass Book {\n    private final String title;\n    private final String author;\n\n    Book(String title, String author) {\n        this.title = title;\n        this.author = author;\n    }\n\n    String getTitle() {\n        return title;\n    }\n\n    String getAuthor() {\n        return author;\n    }\n}\n\nclass Library {\n    private final List<Book> books = new ArrayList<>();\n\n    void addBook(Book book) {\n        books.add(book);\n    }\n\n    Book findByTitle(String title) {\n        for (Book b : books) {\n            if (b.getTitle().equals(title)) {\n                return b;\n            }\n        }\n        return null;\n    }\n\n    boolean removeBook(String title) {\n        for (int i = 0; i < books.size(); i++) {\n            if (books.get(i).getTitle().equals(title)) {\n                books.remove(i);\n                return true;\n            }\n        }\n        return false;\n    }\n\n    int count() {\n        return books.size();\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        Library lib = new Library();\n        check(lib.count() == 0, \"empty library count\");\n\n        Book b1 = new Book(\"Clean Code\", \"Robert Martin\");\n        Book b2 = new Book(\"Effective Java\", \"Joshua Bloch\");\n        lib.addBook(b1);\n        lib.addBook(b2);\n        lib.addBook(new Book(\"Clean Code\", \"Someone Else\"));\n\n        check(lib.count() == 3, \"count after adding 3 books\");\n        check(lib.findByTitle(\"Effective Java\") == b2, \"findByTitle returns the book\");\n        check(lib.findByTitle(\"Missing\") == null, \"findByTitle missing returns null\");\n        check(\"Clean Code\".equals(lib.findByTitle(\"Clean Code\").getTitle()),\n                \"findByTitle finds first match\");\n\n        check(lib.removeBook(\"Clean Code\"), \"removeBook existing returns true\");\n        check(lib.count() == 2, \"count after remove\");\n        check(\"Someone Else\".equals(lib.findByTitle(\"Clean Code\").getAuthor()),\n                \"removeBook removed only the first match\");\n        check(!lib.removeBook(\"Nope\"), \"removeBook missing returns false\");\n        check(lib.count() == 2, \"count unchanged after failed remove\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "number-utils", "name": "number utils", "problem": "# مسألة: NumberUtils\n\nاعمل كلاس `NumberUtils` فيه تلات methods static للأعداد الصحيحة الموجبة.\n\n## المطلوب\n\n- `static int gcd(int a, int b)` — القاسم المشترك الأكبر بتاع `a` و `b` بخوارزمية Euclid. لازم يشتغل مع `a=0` أو `b=0` (gcd(0, 5) = 5).\n- `static boolean isPrime(int n)` — بترجع true لو `n` أولي. الأعداد الأصغر من 2 مش أولية. optimizations اختيارية (i*i <= n).\n- `static String toHex(int n)` — بيحوّل عدد **موجب** للـ hexadecimal lowercase (0-9 و a-f). `toHex(255)` = `\"ff\"`، `toHex(0)` = `\"0\"`، `toHex(16)` = `\"10\"`. **ممنوع** تستخدم `Integer.toHexString` — المطلوب تفكيرك في الخوارزمية (قسمة متكررة على 16).\n\n## نصايح\n\n- `gcd` سهل بـ while loop و `%` — راقب حالة `b == 0`.\n- `isPrime`: جرّب القواسم من 2 لـ `i*i <= n` — أسرع بكتير من اللوب للحد `n`.\n- `toHex`: اقسم على 16 والباقي هو الـ digit — بالترتيب العكسي (remainder الأخير هو أول حرف). فكر في StringBuilder أو recursion. انتبه لـ `n=0` — المفروض ترجع `\"0\"`.\n", "starter": "class NumberUtils {\n    static int gcd(int a, int b) {\n        // TODO: Euclidean algorithm\n        return 0;\n    }\n\n    static boolean isPrime(int n) {\n        // TODO: trial division\n        return false;\n    }\n\n    static String toHex(int n) {\n        // TODO: repeated division by 16\n        return \"\";\n    }\n}\n", "solution": "class NumberUtils {\n    static int gcd(int a, int b) {\n        while (b != 0) {\n            int t = a % b;\n            a = b;\n            b = t;\n        }\n        return a;\n    }\n\n    static boolean isPrime(int n) {\n        if (n < 2) {\n            return false;\n        }\n        for (int i = 2; i * i <= n; i++) {\n            if (n % i == 0) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n    static String toHex(int n) {\n        if (n == 0) {\n            return \"0\";\n        }\n        StringBuilder sb = new StringBuilder();\n        while (n > 0) {\n            int r = n % 16;\n            sb.insert(0, r < 10 ? (char)('0' + r) : (char)('a' + r - 10));\n            n /= 16;\n        }\n        return sb.toString();\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        check(NumberUtils.gcd(48, 18) == 6, \"gcd(48,18)=6\");\n        check(NumberUtils.gcd(17, 5) == 1, \"gcd(17,5)=1\");\n        check(NumberUtils.gcd(0, 5) == 5, \"gcd(0,5)=5\");\n        check(NumberUtils.gcd(100, 10) == 10, \"gcd(100,10)=10\");\n        check(NumberUtils.gcd(7, 13) == 1, \"gcd coprime\");\n\n        check(NumberUtils.isPrime(2), \"isPrime(2)\");\n        check(NumberUtils.isPrime(7), \"isPrime(7)\");\n        check(NumberUtils.isPrime(97), \"isPrime(97)\");\n        check(NumberUtils.isPrime(7919), \"isPrime(7919)\");\n        check(!NumberUtils.isPrime(1), \"isPrime(1)=false\");\n        check(!NumberUtils.isPrime(0), \"isPrime(0)=false\");\n        check(!NumberUtils.isPrime(9), \"isPrime(9)=false\");\n        check(!NumberUtils.isPrime(100), \"isPrime(100)=false\");\n        check(!NumberUtils.isPrime(-7), \"isPrime(-7)=false\");\n\n        check(NumberUtils.toHex(0).equals(\"0\"), \"toHex(0)\");\n        check(NumberUtils.toHex(255).equals(\"ff\"), \"toHex(255)=ff\");\n        check(NumberUtils.toHex(16).equals(\"10\"), \"toHex(16)=10\");\n        check(NumberUtils.toHex(305419896).equals(\"12345678\"), \"toHex(0x12345678)\");\n        check(NumberUtils.toHex(10).equals(\"a\"), \"toHex(10)=a\");\n        check(NumberUtils.toHex(14).equals(\"e\"), \"toHex(14)=e\");\n        check(NumberUtils.toHex(1).equals(\"1\"), \"toHex(1)=1\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "payroll", "name": "payroll", "problem": "# مسألة: Employee / Manager Payroll\n\nابني نظام مرتبات بـ polymorphism — كل نوع employee ليه طريقة حساب مختلفة للـ salary.\n\n## المطلوب\n\n- `class Employee` فيها `protected String name` و `protected double baseSalary` و constructor بياخدهم، و `double getSalary()` بترجع `baseSalary`.\n- `class Manager extends Employee` فيها `private double bonus` زيادة على الـ base، و `getSalary()` بترجع `baseSalary + bonus`.\n- `static double payroll(Employee[] employees)` — بترجع مجموع `getSalary()` لكل الموظفين.\n\n## نصيحة\n\n- حط `payroll` جوه class `Payroll` لو حابب، أو اعملها static في أي حتة — المهم الـ Tests تلاقيها.\n- الـ polymorphism هنا إن `payroll` بتتعامل مع الكل كـ `Employee` بس كل واحد بيرجع مرتبه الصح.\n", "starter": "class Employee {\n    protected String name;\n    protected double baseSalary;\n\n    Employee(String name, double baseSalary) {\n        this.name = name;\n        this.baseSalary = baseSalary;\n    }\n\n    double getSalary() {\n        // TODO: return baseSalary\n        return 0;\n    }\n}\n\nclass Manager extends Employee {\n    private double bonus;\n\n    Manager(String name, double baseSalary, double bonus) {\n        super(name, baseSalary);\n        this.bonus = bonus;\n    }\n\n    double getSalary() {\n        // TODO: return baseSalary + bonus\n        return 0;\n    }\n}\n\nclass Payroll {\n    static double payroll(Employee[] employees) {\n        // TODO: sum getSalary() over all employees\n        return 0;\n    }\n}\n", "solution": "class Employee {\n    protected String name;\n    protected double baseSalary;\n\n    Employee(String name, double baseSalary) {\n        this.name = name;\n        this.baseSalary = baseSalary;\n    }\n\n    double getSalary() {\n        return baseSalary;\n    }\n}\n\nclass Manager extends Employee {\n    private double bonus;\n\n    Manager(String name, double baseSalary, double bonus) {\n        super(name, baseSalary);\n        this.bonus = bonus;\n    }\n\n    double getSalary() {\n        return baseSalary + bonus;\n    }\n}\n\nclass Payroll {\n    static double payroll(Employee[] employees) {\n        double total = 0;\n        for (Employee e : employees) {\n            total += e.getSalary();\n        }\n        return total;\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    static void checkClose(double actual, double expected, String name) {\n        check(Math.abs(actual - expected) < 1e-9, name + \" (got \" + actual + \")\");\n    }\n\n    public static void main(String[] args) {\n        Employee emp = new Employee(\"Sara\", 5000);\n        Manager mgr = new Manager(\"Omar\", 8000, 2000);\n\n        checkClose(emp.getSalary(), 5000, \"employee salary\");\n        checkClose(mgr.getSalary(), 10000, \"manager salary includes bonus\");\n\n        Employee[] staff = {emp, mgr, new Employee(\"Laila\", 3000)};\n        checkClose(Payroll.payroll(staff), 18000, \"payroll total\");\n\n        checkClose(Payroll.payroll(new Employee[0]), 0, \"empty payroll\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "point-equals", "name": "point equals", "problem": "# مسألة: Point equals و hashCode\n\nابني كلاس `Point` يشتغل صح مع `equals` و `hashCode` و `HashSet`.\n\n## المطلوب\n\n- `class Point` فيها `private final int x` و `private final int y` و constructor `Point(int x, int y)`.\n- `equals(Object o)` — بترجع true لو `o` Point ونفس `x` و `y`. استخدم `instanceof` و cast.\n- `hashCode()` — لازم تكون متسقة مع equals (نقطتين متساويتين → نفس الـ hashCode). استخدم `Objects.hash(x, y)` أو دمج يدوي.\n- `toString()` — أي format مقروء، مثلاً `\"Point(3, 4)\"`.\n\n## نصيحة\n\n- `equals` لازم يكون `public` وبتاخد `Object` مش `Point` — وإلا مش هتشتغل مع الـ collections.\n- `Tests.java` بيجرب `HashSet` — لو `hashCode` مش متسقة هتلاقي duplicates.\n", "starter": "import java.util.Objects;\n\nclass Point {\n    private final int x;\n    private final int y;\n\n    Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    public boolean equals(Object o) {\n        // TODO: compare x and y\n        return false;\n    }\n\n    public int hashCode() {\n        // TODO: consistent with equals\n        return 0;\n    }\n\n    public String toString() {\n        // TODO\n        return \"\";\n    }\n}\n", "solution": "import java.util.Objects;\n\nclass Point {\n    private final int x;\n    private final int y;\n\n    Point(int x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n\n    public boolean equals(Object o) {\n        if (this == o) {\n            return true;\n        }\n        if (!(o instanceof Point)) {\n            return false;\n        }\n        Point p = (Point) o;\n        return x == p.x && y == p.y;\n    }\n\n    public int hashCode() {\n        return Objects.hash(x, y);\n    }\n\n    public String toString() {\n        return \"Point(\" + x + \", \" + y + \")\";\n    }\n}\n", "tests": "import java.util.HashSet;\nimport java.util.Set;\n\npublic class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        Point p1 = new Point(3, 4);\n        Point p2 = new Point(3, 4);\n        Point p3 = new Point(3, 5);\n\n        check(p1.equals(p1), \"equals reflexive\");\n        check(p1.equals(p2), \"equals same coords\");\n        check(!p1.equals(p3), \"equals different y\");\n        check(!p1.equals(null), \"equals null\");\n        check(!p1.equals(\"not a point\"), \"equals wrong type\");\n        check(p2.equals(p1), \"equals symmetric\");\n\n        check(p1.hashCode() == p2.hashCode(), \"hashCode consistent with equals\");\n        check(p1.toString().equals(\"Point(3, 4)\"), \"toString format\");\n\n        Set<Point> set = new HashSet<>();\n        set.add(p1);\n        set.add(p2);\n        set.add(p3);\n        check(set.size() == 2, \"HashSet dedups equal points\");\n        check(set.contains(new Point(3, 4)), \"HashSet contains equal point\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "shape-hierarchy", "name": "shape hierarchy", "problem": "# مسألة: Shape Hierarchy\n\nابني hierarchy للـ shapes باستخدام abstract class و polymorphism.\n\n## المطلوب\n\n- `abstract class Shape` فيها `abstract double area()`.\n- `class Circle extends Shape` — constructor بياخد `radius` و `area()` بترجع `Math.PI * r * r`.\n- `class Rectangle extends Shape` — constructor بياخد `width` و `height` و `area()` بترجع `width * height`.\n\n## نصيحة\n\n- `Starter.java` فيه الـ skeleton — كمّل الـ TODOs بس.\n- `Tests.java` بتشيك المساحات الكلية والـ polymorphic dispatch — شغّلها بنفسك قبل ما تسلّم.\n", "starter": "abstract class Shape {\n    abstract double area();\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    Circle(double radius) {\n        this.radius = radius;\n    }\n\n    double area() {\n        // TODO: return the circle area\n        return 0;\n    }\n}\n\nclass Rectangle extends Shape {\n    private final double width;\n    private final double height;\n\n    Rectangle(double width, double height) {\n        this.width = width;\n        this.height = height;\n    }\n\n    double area() {\n        // TODO: return the rectangle area\n        return 0;\n    }\n}\n", "solution": "abstract class Shape {\n    abstract double area();\n}\n\nclass Circle extends Shape {\n    private final double radius;\n\n    Circle(double radius) {\n        this.radius = radius;\n    }\n\n    double area() {\n        return Math.PI * radius * radius;\n    }\n}\n\nclass Rectangle extends Shape {\n    private final double width;\n    private final double height;\n\n    Rectangle(double width, double height) {\n        this.width = width;\n        this.height = height;\n    }\n\n    double area() {\n        return width * height;\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    static void checkClose(double actual, double expected, String name) {\n        check(Math.abs(actual - expected) < 1e-9, name + \" (got \" + actual + \")\");\n    }\n\n    public static void main(String[] args) {\n        Shape[] shapes = {new Circle(1), new Rectangle(2, 3), new Circle(2)};\n\n        checkClose(shapes[0].area(), Math.PI, \"circle r=1 area\");\n        checkClose(shapes[1].area(), 6.0, \"rectangle 2x3 area\");\n        checkClose(shapes[2].area(), 4 * Math.PI, \"circle r=2 area\");\n\n        double total = 0;\n        for (Shape s : shapes) {\n            total += s.area();\n        }\n        checkClose(total, 5 * Math.PI + 6, \"polymorphic total\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}, {"id": "stack", "name": "stack", "problem": "# مسألة: Stack بـ Interface\n\nابني Stack بسيط باستخدام interface + implementation.\n\n## المطلوب\n\n- `interface IntStack` فيها:\n  - `void push(int value)`\n  - `int pop()` — بيرمي `java.util.EmptyStackException` لو الـ stack فاضي\n  - `boolean isEmpty()`\n  - `int size()`\n- `class ArrayStack implements IntStack` — implementation بـ array ثابت الحجم (مثلاً 10 عناصر) و index للـ top.\n\n## نصيحة\n\n- `pop` لازم ترجع آخر عنصر اتعمله push (LIFO) — عكس الـ queue.\n- `Tests.java` بيجرب الترتيب وبيشيك إن الـ pop على stack فاضي بيرمي الـ exception.\n", "starter": "import java.util.EmptyStackException;\n\ninterface IntStack {\n    void push(int value);\n\n    int pop() throws EmptyStackException;\n\n    boolean isEmpty();\n\n    int size();\n}\n\nclass ArrayStack implements IntStack {\n    private final int[] data = new int[10];\n    private int top = 0;\n\n    public void push(int value) {\n        // TODO: store value and move top\n    }\n\n    public int pop() {\n        // TODO: return last pushed value, throw EmptyStackException if empty\n        return 0;\n    }\n\n    public boolean isEmpty() {\n        // TODO\n        return true;\n    }\n\n    public int size() {\n        // TODO\n        return 0;\n    }\n}\n", "solution": "import java.util.EmptyStackException;\n\ninterface IntStack {\n    void push(int value);\n\n    int pop() throws EmptyStackException;\n\n    boolean isEmpty();\n\n    int size();\n}\n\nclass ArrayStack implements IntStack {\n    private final int[] data = new int[10];\n    private int top = 0;\n\n    public void push(int value) {\n        data[top++] = value;\n    }\n\n    public int pop() {\n        if (isEmpty()) {\n            throw new EmptyStackException();\n        }\n        return data[--top];\n    }\n\n    public boolean isEmpty() {\n        return top == 0;\n    }\n\n    public int size() {\n        return top;\n    }\n}\n", "tests": "public class Tests {\n    static int failures = 0;\n\n    static void check(boolean cond, String name) {\n        if (cond) {\n            System.out.println(\"PASS \" + name);\n        } else {\n            failures++;\n            System.out.println(\"FAIL \" + name);\n        }\n    }\n\n    public static void main(String[] args) {\n        IntStack stack = new ArrayStack();\n\n        check(stack.isEmpty(), \"new stack is empty\");\n        check(stack.size() == 0, \"new stack size 0\");\n\n        stack.push(1);\n        stack.push(2);\n        stack.push(3);\n\n        check(!stack.isEmpty(), \"stack not empty after pushes\");\n        check(stack.size() == 3, \"size after 3 pushes\");\n\n        check(stack.pop() == 3, \"pop returns last pushed (LIFO)\");\n        check(stack.pop() == 2, \"second pop\");\n        check(stack.pop() == 1, \"third pop\");\n        check(stack.isEmpty(), \"empty after popping all\");\n\n        boolean threw = false;\n        try {\n            stack.pop();\n        } catch (java.util.EmptyStackException e) {\n            threw = true;\n        }\n        check(threw, \"pop on empty throws EmptyStackException\");\n\n        if (failures > 0) {\n            System.out.println(failures + \" test(s) failed\");\n            System.exit(1);\n        }\n        System.out.println(\"ALL TESTS PASSED\");\n    }\n}\n"}]};
const KEY = "javaOopQuizV1";
function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if(!raw || typeof raw !== "object") return {answers:{}, order:[], reviewOnly:false};
    const validIds = new Set(DATA.questions.map(q=>q.id));
    const answers = {};
    if(raw.answers && typeof raw.answers === "object"){
      for(const id of Object.keys(raw.answers)){
        const a = raw.answers[id];
        if(validIds.has(id) && a && typeof a === "object" && typeof a.correct === "boolean") answers[id] = a;
      }
    }
    const order = Array.isArray(raw.order) ? raw.order.filter(id=>validIds.has(id)) : [];
    return {answers, order, reviewOnly: !!raw.reviewOnly};
  }catch(e){ return {answers:{}, order:[], reviewOnly:false}; }
}
let state = loadState();
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function answerText(q){
  if(q.options) return q.options[q.answerIndex];
  if(q.compileError) return "COMPILE_ERROR";
  if(q.exception) return "EXCEPTION=" + q.exception + "\n" + q.expected;
  return q.expected;
}

const KEYWORDS = new Set(("abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record sealed permits yield").split(" "));
function highlight(src){
  let out="", i=0, n=src.length;
  const token=(re)=>{const m=src.slice(i).match(re); if(m){out+=m[0]; i+=m[0].length; return true;} return false;};
  while(i<n){
    if(src.startsWith("//",i)){const e=src.indexOf("\n",i); const t=e<0?src.slice(i):src.slice(i,e); out+='<span class="com">'+esc(t)+'</span>'; i+=t.length; continue;}
    if(src.startsWith("/*",i)){const e=src.indexOf("*/",i+2); const t=e<0?src.slice(i):src.slice(i,e+2); out+='<span class="com">'+esc(t)+'</span>'; i+=t.length; continue;}
    if(src[i]==='"'||src[i]==="'"){const q=src[i]; let j=i+1; while(j<n){if(src[j]==="\\"){j+=2;continue;} if(src[j]===q){j++;break;} if(src[j]==="\n")break; j++;} out+='<span class="str">'+esc(src.slice(i,j))+'</span>'; i=j; continue;}
    if(/[0-9]/.test(src[i])){const m=src.slice(i).match(/^[0-9][\w.]*/); out+='<span class="num">'+m[0]+'</span>'; i+=m[0].length; continue;}
    if(/[A-Za-z_$]/.test(src[i])){const m=src.slice(i).match(/^[A-Za-z_$][\w$]*/); const w=m[0];
      let cls=""; if(KEYWORDS.has(w)) cls="kw"; else if(["String","System","Object","Integer","Exception","RuntimeException","Override","Deprecated","SuppressWarnings","FunctionalInterface","SafeVarargs","Test"].includes(w)) cls="typ";
      out+=(cls?'<span class="'+cls+'">'+w+'</span>':w); i+=w.length; continue;}
    out+=esc(src[i]); i++;
  }
  return out;
}
function mdInline(s){
  s=esc(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  return s;
}
function renderMd(src){
  const lines=src.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
  const isTable=l=>/^\s*\|.*\|\s*$/.test(l);
  const isSep=r=>/^[\s|:\-]+$/.test(r.trim());
  const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  let out="",i=0;
  while(i<lines.length){
    const l=lines[i];
    if(/^```/.test(l)){
      const lang=l.slice(3).trim();let buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;const code=buf.join("\n");
      out+='<pre class="code"><code>'+(lang==="output"?esc(code):highlight(code))+'</code></pre>';continue;
    }
    if(/^#{1,4}\s/.test(l)){
      const lv=l.match(/^#+/)[0].length;
      out+="<h"+(lv+1)+">"+mdInline(l.replace(/^#+\s*/,""))+"</h"+(lv+1)+">";i++;continue;
    }
    if(isTable(l)){
      const rows=[];
      while(i<lines.length&&isTable(lines[i])){rows.push(lines[i]);i++;}
      const head=cells(rows[0]);
      const body=rows.slice(1).filter(r=>!isSep(r));
      out+="<table><thead><tr>"+head.map(c=>"<th>"+mdInline(c)+"</th>").join("")+"</tr></thead><tbody>";
      body.forEach(r=>{out+="<tr>"+cells(r).map(c=>"<td>"+mdInline(c)+"</td>").join("")+"</tr>";});
      out+="</tbody></table>";continue;
    }
    if(/^\s*[-*]\s+/.test(l)){
      out+="<ul>";
      while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){out+="<li>"+mdInline(lines[i].replace(/^\s*[-*]\s+/,""))+"</li>";i++;}
      out+="</ul>";continue;
    }
    if(l.trim()===""){i++;continue;}
    const buf=[];
    while(i<lines.length&&lines[i].trim()!==""&&!/^```|^#{1,4}\s|^\s*[-*]\s+/.test(lines[i])&&!isTable(lines[i])){buf.push(lines[i]);i++;}
    out+="<p>"+mdInline(buf.join(" "))+"</p>";
  }
  return out;
}
function filtered(){
  const lec=$("lecSel").value, t=$("topicSel").value;
  let qs=DATA.questions;
  if(lec) qs=qs.filter(q=>q.lecture===lec);
  else if(t) qs=qs.filter(q=>q.topic===t);
  if(state.reviewOnly){qs=qs.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);}
  return qs;
}
function renderTopics(){
  const sel=$("topicSel"); sel.innerHTML="";
  const all=document.createElement("option"); all.value=""; all.textContent="كل الأسئلة ("+DATA.questions.length+")"; sel.appendChild(all);
  const counts={}; DATA.questions.forEach(q=>{if(!q.lecture)counts[q.topic]=(counts[q.topic]||0)+1;});
  Object.keys(counts).sort().forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=DATA.topics[t]+" ("+counts[t]+")";sel.appendChild(o);});
}
function renderLectures(){
  const sel=$("lecSel"); sel.innerHTML="";
  const none=document.createElement("option"); none.value=""; none.textContent="— محاضرة —"; sel.appendChild(none);
  const counts={}; DATA.questions.forEach(q=>{if(q.lecture)counts[q.lecture]=(counts[q.lecture]||0)+1;});
  DATA.lectures.forEach(l=>{const o=document.createElement("option");o.value=l.id;o.textContent="محاضرة "+l.order+": "+l.title_ar+" ("+(counts[l.id]||0)+")";sel.appendChild(o);});
}
function toggleExplain(){
  $("explainBtn").style.display=$("lecSel").value?"":"none";
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){
  state.reviewOnly=false; save();
  const qs=filtered(); state.order=qs.map(q=>q.id); state.cur=0; state.phase="ask"; save(); draw();
}
function draw(){
  const area=$("quizArea");
  if(!state.order.length){
    area.innerHTML='<div class="card muted">مفيش أسئلة في الاختيار ده.</div>';
    return;
  }
  if(state.cur>=state.order.length) state.cur=0;
  const id=state.order[state.cur]; const q=DATA.questions.find(x=>x.id===id);
  if(!q){ state.order=state.order.filter(x=>x!==id); draw(); return; }
  const answered=!!state.answers[id];
  const ans=state.answers[id];
  const mode=q.options?"mcq":(q.compileError?"choice":(q.exception?"exc":"output"));
  const pos=state.order.indexOf(id)+1;
  let html='<div class="card"><div class="tags"><span class="tag">سؤال '+pos+' من '+state.order.length+'</span><span class="tag">'+esc(q.topicLabel)+'</span>'+(q.theory?'<span class="tag nazri">نظري</span>':"")+(q.title?'<span class="tag">'+esc(q.title)+'</span>':"")+'</div>';
  if(q.code) html+='<pre class="code"><code>'+highlight(q.code)+'</code></pre>';
  if(mode==="mcq"){
    html+='<div class="opts">';
    q.options.forEach((t,i)=>{
      html+='<div class="opt'+(ans&&String(ans.pick)===String(i)?" sel":"")+'" data-idx="'+i+'">'+esc(t)+'</div>';
    });
    html+='</div>';
  } else if(mode==="choice"){
    html+='<div class="opts">';
    ["فيه Compile Error","مفيش — بيترجم ويشتغل"].forEach((t,i)=>{
      const pick=i===0? "compile":"run";
      html+='<div class="opt'+(ans&&ans.pick===pick?" sel":"")+'" data-pick="'+pick+'">'+t+'</div>';
    });
    html+='</div>';
  } else if(mode==="exc"){
    html+='<div class="opts">';
    [["exc","بيرمي Runtime Exception"],["compile","Compile Error"],["run","بيطبع ناتج عادي"]].forEach(([p,t])=>{
      html+='<div class="opt'+(ans&&ans.pick===p?" sel":"")+'" data-pick="'+p+'">'+t+'</div>';
    });
    html+='</div>';
    html+='<div class="muted">لو اخترت "بيرمي Exception" اسم الـ Exception هيظهر في الإجابة تحت.</div>';
  } else {
    html+='<div class="muted">اكتب الناتج اللي هيطبعه البرنامج (stdout). لو بيقع بـ Runtime Exception اختار الزرار.</div>';
    html+='<textarea id="ansBox" dir="ltr" placeholder="الناتج هنا..."></textarea>';
    html+='<div class="opts" style="flex-direction:row;flex-wrap:wrap">';
    html+='<div class="opt" data-pick="exc">بيرمي Runtime Exception</div>';
    html+='<div class="opt" data-pick="compile">Compile Error</div>';
    html+='<div class="opt" id="submitOut" style="background:var(--accent);color:#082f49;font-weight:700">شيك</div>';
    html+='</div>';
  }
  html+='<div style="display:flex;gap:8px;margin-top:10px"><button class="primary" id="nextBtn"'+(answered?"":" disabled")+'>التالي</button></div>';
  html+='<div class="feedback" id="fb"></div>';
  html+='<div class="expl'+(answered?" show":"")+'" id="expl">';
  html+='<b>الإجابة الصحيحة:</b><pre class="code" style="margin:8px 0"><code>'+esc(answerText(q))+'</code></pre>';
  html+='<div>'+esc(q.explanation)+'</div></div>';
  html+='</div>';
  area.innerHTML=html;
  const fb=$("fb");
  if(answered){
    fb.className="feedback "+(ans.correct?"ok":"no");
    fb.textContent=ans.correct?"✔ إجابة صح!":"✘ إجابة غلط — شوف الإجابة تحت.";
  }
  area.querySelectorAll(".opt").forEach(o=>{
    if(answered) return;
    o.onclick=()=>{
      const pick=o.dataset.idx!==undefined?o.dataset.idx:o.dataset.pick;
      if(mode==="output"&&pick==="exc"){
        submitOutput(q,"exc"); return;
      }
      if(mode==="output"&&pick==="compile"){
        submitOutput(q,"compile"); return;
      }
      if(mode==="output"&&o.id==="submitOut"){
        submitOutput(q,"text"); return;
      }
      grade(q,pick,null);
    };
  });
  if(!answered&&mode==="output"){
    const box=$("ansBox"); box.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))submitOutput(q,"text");});
  }
  const nb=$("nextBtn");
  if(nb) nb.onclick=()=>{state.cur++; if(state.cur>=state.order.length){state.cur=0;} save(); draw();};
  updateScore();
}
function submitOutput(q,kind){
  const txt=$("ansBox")?$("ansBox").value:"";
  let correct=false;
  if(kind==="exc") correct=!!q.exception;
  else if(kind==="compile") correct=q.compileError;
  else {
    correct=!q.compileError&&!q.exception&&norm(txt)===norm(q.expected);
  }
  grade(q,kind,txt,correct);
}
function grade(q,pick,typed,precomputed){
  const id=q.id;
  let correct;
  if(precomputed!==undefined) correct=precomputed;
  else if(q.options) correct=String(pick)===String(q.answerIndex);
  else if(pick==="compile") correct=q.compileError;
  else if(pick==="exc") correct=!!q.exception;
  else if(pick==="run") correct=!q.compileError&&!q.exception;
  else correct=false;
  state.answers[id]={correct,pick,typed:typed||""}; save(); draw();
}
function updateScore(){
  const total=Object.keys(state.answers).length;
  const right=Object.values(state.answers).filter(a=>a.correct).length;
  $("scoreLabel").textContent=total?`${right}/${total} صح` : "";
  const all=DATA.questions.length;
  const done=new Set(Object.keys(state.answers)).size;
  $("barFill").style.width=(done/all*100)+"%";
}
function showError(e){
  const area=$("quizArea") || document.body;
  area.innerHTML='<div class="card"><b>حصل خطأ غير متوقع في تحميل الكويز.</b><pre class="code">'+esc(String(e&&e.stack||e))+'</pre></div>';
}
try{
  $("lecSel").onchange=()=>{if($("lecSel").value)$("topicSel").value="";toggleExplain();start();};
  $("topicSel").onchange=()=>{if($("topicSel").value)$("lecSel").value="";toggleExplain();start();};
  $("explainBtn").onclick=()=>{
    const id=$("lecSel").value;
    const lec=DATA.lectures.find(l=>l.id===id);
    const wrap=$("explainWrap");
    if(wrap.style.display!=="none"){wrap.style.display="none";return;}
    if(!lec){wrap.style.display="none";return;}
    $("explainCard").innerHTML=renderMd(lec.content)+'<div style="margin-top:14px;text-align:center"><button class="primary" id="startLectureBtn">ابدأ الأسئلة</button></div>';
    $("startLectureBtn").onclick=start;
    wrap.style.display="";
    wrap.scrollIntoView({behavior:"smooth",block:"start"});
  };
  $("shuffleBtn").onclick=()=>{const qs=filtered();state.order=shuffle(qs.map(q=>q.id));state.cur=0;state.phase="ask";save();draw();};
  $("reviewBtn").onclick=()=>{state.reviewOnly=true;const wrong=DATA.questions.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);if(!wrong.length){alert("مفيش إجابات غلط للمراجعة!");return;}state.order=wrong.map(q=>q.id);state.cur=0;save();draw();};
  $("resetBtn").onclick=()=>{if(confirm("تمسح كل التقدم؟")){localStorage.removeItem(KEY);state={answers:{},order:[],reviewOnly:false};start();}};
  renderTopics();
  renderLectures();
  toggleExplain();
  updateScore();
  start();
}catch(e){
  showError(e);
}
</script>
</body>
</html>
